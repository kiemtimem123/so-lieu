name: Financial Report Queue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: financial-report-queue
  cancel-in-progress: false

jobs:
  validate-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate queue and registry
        run: node .github/scripts/validate-report-queue.cjs
      - name: Summarize queued work
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const q = JSON.parse(fs.readFileSync('config/report-queue.json','utf8'));
          const counts = {};
          for (const j of q.jobs) counts[j.status] = (counts[j.status] || 0) + 1;
          console.log(JSON.stringify({total:q.jobs.length,counts,notice:'This workflow validates and summarizes jobs only. It does not claim reports were downloaded or verified.'},null,2));
          NODE
