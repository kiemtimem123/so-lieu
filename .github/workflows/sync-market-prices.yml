
name: Sync market prices

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and save market prices
        shell: bash
        env:
          DLKT_API_KEY: ${{ secrets.DLKT_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DLKT_API_KEY:-}" ]; then
            echo "ERROR: Missing DLKT_API_KEY secret."
            exit 1
          fi

          FROM_DATE=$(date -u -d "30 days ago" +%F)

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --max-time 30 \
            --get \
            --header "Authorization: Bearer ${DLKT_API_KEY}" \
            --data-urlencode "ids=37826,37827,37694,37828,37695" \
            --data-urlencode "from=${FROM_DATE}" \
            --data-urlencode "limit=500" \
            --output response.json \
            --write-out "%{http_code}" \
            "https://api.dulieukinhte.com/v1/series/observations")

          echo "API HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: API request failed. Response:"
            cat response.json
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          with open("response.json", encoding="utf-8") as f:
              result = json.load(f)

          if not isinstance(result, dict):
              raise SystemExit("ERROR: API response is not a JSON object.")

          if "error" in result:
              error = result["error"]
              raise SystemExit(
                  "API error: "
                  + str(error.get("code", "unknown"))
                  + " | "
                  + str(error.get("message", "Không có thông báo"))
              )

          labels = {
              37826: "WTI",
              37827: "Brent",
              37694: "Xăng thường tại Mỹ",
              37828: "Dầu diesel tại Mỹ",
              37695: "Khí tự nhiên Henry Hub",
          }

          expected = set(labels)
          found = {}

          for item in result.get("data", []):
              sid = item.get("id")

              if sid not in expected:
                  continue

              if item.get("skipped"):
                  raise SystemExit(
                      f"Series {sid} skipped; previous data preserved."
                  )

              observations = item.get("observations", [])

              if not observations:
                  raise SystemExit(
                      f"No observations for series {sid}; "
                      "previous data preserved."
                  )

              latest = max(
                  observations,
                  key=lambda observation: observation.get("date") or ""
              )

              value = latest.get("value")
              date = latest.get("date")

              if value is None or not date:
                  raise SystemExit(
                      f"Missing value or date for series {sid}."
                  )

              found[sid] = {
                  "id": sid,
                  "name": labels[sid],
                  "value": value,
                  "unit": item.get("unit"),
                  "date": date,
              }

          missing = sorted(expected - set(found))

          if missing:
              raise SystemExit(
                  f"Missing series IDs: {missing}; "
                  "previous data preserved."
              )

          output = {
              "source": "DulieuKinhte API",
              "fetchedAt": datetime.now(timezone.utc).isoformat(),
              "data": [found[sid] for sid in labels],
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/market-prices.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Saved all five market series.")

          for item in output["data"]:
              print(
                  item["name"],
                  "|",
                  item["value"],
                  item["unit"],
                  "|",
                  item["date"]
              )
          PY

      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail

          rm -f response.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market-prices.json

          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Update market prices data"
            git push
          fi

