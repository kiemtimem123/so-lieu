name: Sync Market and Currency Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/sync-currency-rates.cjs"
      - ".github/scripts/sync-market-prices.cjs"
      - ".github/workflows/sync-market-prices.yml"
  schedule:
    - cron: "15 23 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch market data
        shell: bash
        env:
          DLKT_API_KEY: ${{ secrets.DLKT_API_KEY }}
        run: |
          set -eu
          if [ -z "${DLKT_API_KEY:-}" ]; then
            echo "ERROR: Missing DLKT_API_KEY secret."
            exit 1
          fi
          FROM_DATE="$(date -u -d '30 days ago' +%F)"
          STATUS="$(curl --silent --show-error --max-time 30 --get \
            --header "Authorization: Bearer ${DLKT_API_KEY}" \
            --data-urlencode "ids=37826,37827,37694,37828,37695,36708,36711,36714,36710,34248,34249,34251,29387,29388,29380,29406,66457,33392,33408,33414" \
            --data-urlencode "from=${FROM_DATE}" \
            --data-urlencode "limit=50" \
            --output response.json --write-out "%{http_code}" \
            "https://api.dulieukinhte.com/v1/series/observations")"
          echo "Market API HTTP status: ${STATUS}"
          case "${STATUS}" in 2*) ;; *) cat response.json; exit 1 ;; esac

      - name: Fetch currency reference rates
        shell: bash
        run: |
          set -eu
          STATUS="$(curl --silent --show-error --max-time 30 \
            --output currency-response.json --write-out "%{http_code}" \
            "https://open.er-api.com/v6/latest/USD")"
          echo "Currency API HTTP status: ${STATUS}"
          case "${STATUS}" in 2*) ;; *) cat currency-response.json; exit 1 ;; esac

      - name: Validate and save snapshots
        shell: bash
        run: |
          set -eu
          node .github/scripts/sync-market-prices.cjs
          node .github/scripts/sync-currency-rates.cjs
          node .github/scripts/sync-financial-rates.cjs

      - name: Commit updated data
        shell: bash
        run: |
          set -eu
          rm -f response.json currency-response.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve generated snapshots, then synchronize with the latest main
          # before committing to avoid non-fast-forward push failures.
          cp data/market-prices.json /tmp/market-prices.json
          cp data/currency-rates.json /tmp/currency-rates.json
          cp data/financial-rates.json /tmp/financial-rates.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/market-prices.json data/market-prices.json
          cp /tmp/currency-rates.json data/currency-rates.json
          cp /tmp/financial-rates.json data/financial-rates.json
          git add data/market-prices.json data/currency-rates.json data/financial-rates.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update market and currency data"
            git push origin HEAD:main
          fi
