name: OCR Financial Report Archive

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:
    inputs:
      symbol:
        description: Ticker to OCR; blank selects the first incomplete ticker in the agreed sequence
        required: false
        default: ""
      max_pages:
        description: Pages per report to OCR
        required: false
        default: "18"
      rescan_pages:
        description: Comma-separated page numbers to re-OCR even if text is already present
        required: false
        default: "10,11"
      max_reports:
        description: Maximum report files to process in this run (fixed to one file)
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: so-lieu-financial-data-writes-v1
  cancel-in-progress: false

jobs:
  ocr:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install OCR system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng

      - name: Install extraction dependencies
        run: pip install -r .github/scripts/requirements-report-worker.txt

      - name: Validate queue before OCR
        run: node .github/scripts/validate-report-queue.cjs

      - name: OCR stored report archive
        id: run_ocr
        env:
          REPORT_OCR_SYMBOL: ${{ github.event.inputs.symbol || '' }}
          REPORT_OCR_MAX_PAGES: ${{ github.event.inputs.max_pages || '14' }}
          REPORT_OCR_MAX_REPORTS: "1"
          REPORT_OCR_DPI: '280'
          REPORT_OCR_RESCAN_PAGES: ${{ github.event.inputs.rescan_pages || '10,11' }}
        run: python .github/scripts/ocr-stored-reports.py

      - name: Validate queue after OCR
        run: node .github/scripts/validate-report-queue.cjs

      - name: Enrich quarterly financial categories from OCR text
        env:
          FINANCIAL_ENRICH_SYMBOL: ${{ steps.run_ocr.outputs.symbol || github.event.inputs.symbol || '' }}
        run: python scripts/enrich-financial-categories.py

      - name: Validate enriched financial snapshots
        run: node scripts/validate-financials.mjs

      - name: Commit OCR text and financial enrichment
        env:
          REPORT_OCR_SYMBOL: ${{ github.event.inputs.symbol || '' }}
          REPORT_OCR_MAX_PAGES: ${{ github.event.inputs.max_pages || '14' }}
          REPORT_OCR_MAX_REPORTS: "1"
          REPORT_OCR_DPI: '280'
          REPORT_OCR_RESCAN_PAGES: ${{ github.event.inputs.rescan_pages || '10,11' }}
          FINANCIAL_ENRICH_SYMBOL: ${{ steps.run_ocr.outputs.symbol || github.event.inputs.symbol || '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false

          for attempt in 1 2 3 4 5; do
            git add reports/raw data/financials-*.json
            if git diff --cached --quiet; then
              echo "No OCR or enrichment changes."
              exit 0
            fi

            git commit -m "OCR and enrich Vietstock financial report fields"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
            else
              echo "::warning::Concurrent snapshot update detected; preserving OCR page text and rebuilding financial enrichment on the latest main."
              git diff HEAD^ HEAD -- reports/raw > /tmp/solie-report-archive.patch
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main

              if [ -s /tmp/solie-report-archive.patch ]; then
                if ! git apply --3way /tmp/solie-report-archive.patch; then
                  echo "::error::Could not merge newly extracted report-page text with the latest archive. No snapshot values will be force-pushed."
                  git status --short
                  exit 1
                fi
              fi

              node .github/scripts/validate-report-queue.cjs
              python .github/scripts/ocr-stored-reports.py
              node .github/scripts/validate-report-queue.cjs
              python scripts/enrich-financial-categories.py
              node scripts/validate-financials.mjs
              git add reports/raw data/financials-*.json
              if git diff --cached --quiet; then
                echo "Archive text is preserved; no additional safe snapshot fields were found after recomputation."
                pushed=true
                break
              fi
            fi
            sleep $((attempt * 2))
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Could not push OCR and enriched snapshot changes after five safe attempts."
            exit 1
          fi

      - name: Upload OCR summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: financial-report-ocr-summary
          path: reports/raw/**/*.extracted.json
          if-no-files-found: ignore
          retention-days: 30
