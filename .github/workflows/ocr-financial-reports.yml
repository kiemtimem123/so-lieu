name: OCR Financial Report Archive
# Re-run the active checkpoint ticker after validation-policy fixes.
# Reprocess the other-statement schema v10 so income/cash-flow fields are tracked and visible.
# Continue migration one ticker at a time from the saved checkpoint.
# Queue picker now uses the v10 detail schema so migrated tickers are not repeated.
# Continue migration after TCX from the persisted checkpoint.
# Continue migration after SHB from the persisted checkpoint.
# Continue migration after FPT from the persisted checkpoint.
# Continue with the next persisted ticker after ACB.
# Permit incomplete fields to remain explicitly unverified until report extraction is complete.
# Resume the queue after the DPG Q2 2025 source-backed extraction was completed.
# OCR DPG Q2 2025 full consolidated PDF now linked from the quarterly snapshot.
# Resume GAS next per user request; defer DPG manual-review fields.

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/ocr-stored-reports.py"
      - "scripts/enrich-financial-categories.py"
      - "config/securities.json"
      - ".github/workflows/ocr-financial-reports.yml"
  schedule:
    - cron: "*/30 * * * *"
    - cron: "5 3 * * *"
  workflow_dispatch:
    inputs:
      symbol:
        description: Ticker to OCR; blank selects the first incomplete ticker in configuration order
        required: false
        default: ""
      max_pages:
        description: Pages per report to OCR (covers the main financial statements; use a larger number only when needed)
        required: false
        default: "18"
      rescan_pages:
        description: Comma-separated page numbers to re-OCR even if text is already present
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: so-lieu-financial-data-writes-v2
  cancel-in-progress: false

jobs:
  select-ticker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    outputs:
      symbol: ${{ steps.pick.outputs.symbol }}
      bootstrap_symbol: ${{ steps.pick.outputs.bootstrap_symbol }}
      collector_symbol: ${{ steps.pick.outputs.collector_symbol }}
      pause_ocr_chain: ${{ steps.pick.outputs.pause_ocr_chain }}
    steps:
      - name: Checkout ticker registry and snapshot headers only
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/securities.json
            /config/report-queue.json
            /reports/processing-checkpoint.json
            /data/financials-*.json
            /reports/raw/**/*.extracted.json

      - name: Pick the first incomplete ticker in configured order
        id: pick
        env:
          REQUESTED_SYMBOL: ${{ github.event.inputs.symbol || '' }}
          TARGET_MAX_PAGES: ${{ github.event.inputs.max_pages || (github.event_name == 'push' && '18') || '18' }}
          TARGET_RESCAN_PAGES: ${{ github.event.inputs.rescan_pages || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          config = json.loads(Path("config/securities.json").read_text(encoding="utf-8"))
          symbols = [
              str(item.get("symbol") or "").strip().upper()
              for item in config.get("securities", [])
              if isinstance(item, dict) and item.get("enabled") is not False and item.get("symbol")
          ]

          def load_json(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return None

          skip_through_by_symbol = {
              str(item.get("symbol") or "").strip().upper(): str(item.get("skipUnconfirmedThroughPeriod") or "").strip()
              for item in config.get("securities", [])
              if isinstance(item, dict) and item.get("symbol") and item.get("skipUnconfirmedThroughPeriod")
          }

          def latest_quarter(snapshot):
              if not isinstance(snapshot, dict):
                  return ""
              periods = [
                  str(item.get("period") or "")
                  for item in (snapshot.get("items") or [])
                  if isinstance(item, dict) and re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or ""))
              ]
              return max(periods, default="")

          def should_skip_unconfirmed(symbol, snapshot, saved_state=None):
              latest = latest_quarter(snapshot)
              configured_limit = skip_through_by_symbol.get(symbol, "")
              if configured_limit and (not latest or latest <= configured_limit):
                  return True
              if isinstance(saved_state, dict) and saved_state.get("skipUnconfirmedAutomation") is True:
                  state_limit = str(saved_state.get("skipUnconfirmedThroughPeriod") or saved_state.get("lastQuarter") or "").strip()
                  if state_limit and (not latest or latest <= state_limit):
                      return True
              return False

          def payload_needs_pages(payload):
              if not isinstance(payload, dict):
                  return False
              if payload.get("kind") == "pdf":
                  documents = [payload]
              elif payload.get("kind") == "zip":
                  documents = [member for member in payload.get("members", []) if isinstance(member, dict) and member.get("kind") == "pdf"]
              else:
                  return False
              try:
                  page_limit = min(18, max(1, int(os.environ.get("TARGET_MAX_PAGES", "8"))))
              except (TypeError, ValueError):
                  page_limit = 8
              rescan_pages = {
                  int(value.strip())
                  for value in os.environ.get("TARGET_RESCAN_PAGES", "").split(",")
                  if value.strip().isdigit()
              }
              for document in documents:
                  try:
                      page_count = int(document.get("page_count") or 0)
                  except (TypeError, ValueError):
                      page_count = 0
                  target_count = min(max(page_count, 0), page_limit)
                  pages = {
                      int(page.get("page")): page
                      for page in document.get("pages", [])
                      if isinstance(page, dict) and str(page.get("page", "")).isdigit()
                  }
                  if any(number not in pages for number in range(1, target_count + 1)):
                      return True
                  for number in rescan_pages:
                      if not 1 <= number <= target_count:
                          continue
                      page = pages.get(number)
                      if page is None or not page.get("forced_rescan_completed"):
                          return True
                      try:
                          score = float(page.get("ocr_quality_score") or 0)
                          attempts = int(page.get("forced_rescan_count") or 1)
                      except (TypeError, ValueError):
                          score, attempts = 0.0, 1
                      if score < 0.34 and attempts < 3:
                          return True
              return False

          def ticker_has_ocr_gap(symbol, items):
              for item in items:
                  if not isinstance(item, dict) or not re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or "")):
                      continue
                  if terminal_manual_extraction(item):
                      continue
                  source = str(item.get("source_archive_file") or "").strip()
                  if not source:
                      continue
                  archive_path = (Path(source)).resolve()
                  try:
                      archive_path.relative_to(Path("reports/raw").resolve())
                  except ValueError:
                      continue
                  sidecar = Path(str(archive_path) + ".extracted.json")
                  extracted = load_json(sidecar)
                  if extracted is not None and payload_needs_pages(extracted):
                      return True
              return False

          checkpoint = load_json(Path("reports/processing-checkpoint.json")) or {}
          checkpoint_states = checkpoint.get("symbolStates") or {}
          completed_symbols = {
              str(symbol).strip().upper()
              for symbol, state in checkpoint_states.items()
              if isinstance(state, dict) and state.get("completeForAutomation") is True
          }
          # Also retain completion from the latest checkpoint record if older
          # checkpoints do not yet have the per-symbol state map.
          latest = checkpoint.get("lastProgress") or {}
          if latest.get("completeForAutomation") is True and latest.get("symbol"):
              completed_symbols.add(str(latest["symbol"]).strip().upper())
          requested = os.environ.get("REQUESTED_SYMBOL", "").strip().upper()
          bootstrap_symbol = ""
          if requested:
              if requested not in symbols:
                  raise SystemExit(f"Ticker {requested} is not enabled in config/securities.json")
              selected = requested
          else:
              selected = ""
              now = __import__("datetime").datetime.now(__import__("datetime").timezone.utc).timestamp()
              # Resume the explicitly persisted active ticker before scanning the registry.
              # This prevents an old completion flag elsewhere in the queue from causing
              # an in-progress ticker to be skipped after a manual checkpoint correction.
              active_hint = str(checkpoint.get("activeSymbol") or checkpoint.get("resumeSymbolHint") or "").strip().upper()
              if active_hint in symbols and active_hint not in completed_symbols:
                  active_snapshot = load_json(Path("data") / f"financials-{active_hint}.json")
                  if active_snapshot is not None and should_skip_unconfirmed(active_hint, active_snapshot, checkpoint_states.get(active_hint)):
                      print(f"Skipping active ticker {active_hint}: unconfirmed items are held for manual review through {skip_through_by_symbol.get(active_hint) or (checkpoint_states.get(active_hint) or {}).get('lastQuarter')}.")
                  elif active_snapshot is not None:
                      selected = active_hint
                      print(f"Resuming active checkpoint ticker first: {active_hint}.")
              for symbol in ([] if selected else symbols):
                  path = Path("data") / f"financials-{symbol}.json"
                  snapshot = load_json(path)
                  if snapshot is None:
                      # Bootstrap only the first missing ticker, after all earlier
                      # configured symbols have completed their extraction/review state.
                      bootstrap_symbol = symbol
                      break
                  # Skip only through the explicitly closed period. A later quarter
                  # releases the ticker back into the normal queue automatically.
                  saved_state = checkpoint_states.get(symbol)
                  if should_skip_unconfirmed(symbol, snapshot, saved_state):
                      limit = skip_through_by_symbol.get(symbol) or (saved_state or {}).get("skipUnconfirmedThroughPeriod") or (saved_state or {}).get("lastQuarter") or ""
                      print(f"Skipping {symbol}: unresolved values remain blank for manual review through {limit}.")
                      continue
                  # Use the durable ticker checkpoint as the queue cursor. Existing snapshots
                  # can be present before the ticker has completed its one-at-a-time OCR pass.
                  if symbol not in completed_symbols:
                      selected = symbol
                      print(f"Selected {symbol} from the persisted completion queue.")
                      break
                  # "complete_needs_manual_review" is not enough to skip a ticker
                  # when some quarters still have no core figures or statement pages.
                  # A complete core snapshot can still have stale detail fields.
                  # Let the detail-schema and statement-page checks below decide
                  # whether this ticker needs a refresh before skipping it.
                  items = snapshot.get("items") or []
                  if not items:
                      attempts = int(snapshot.get("bootstrap_attempt_count") or 0)
                      terminal = (
                          attempts >= 3
                          and snapshot.get("sync_status") in {
                              "fetch_failed", "no_quarterly_consolidated_records_returned",
                              "needs_manual_review_no_quarterly_data"
                          }
                      )
                      if terminal:
                          continue
                      stamp = snapshot.get("bootstrap_last_attempt_at") or snapshot.get("fetchedAt")
                      age = 10**12
                      if stamp:
                          try:
                              from datetime import datetime, timezone
                              age = now - datetime.fromisoformat(str(stamp).replace("Z", "+00:00")).timestamp()
                          except (TypeError, ValueError, OSError):
                              pass
                      if age >= 30 * 60:
                          bootstrap_symbol = symbol
                          print(f"Bootstrap retry eligible for {symbol}; last attempt cooldown has expired.")
                      else:
                          print(f"Hold queue at {symbol}; waiting for its 30-minute retry cooldown.")
                      break
                  def terminal_manual_extraction(item):
                      if not isinstance(item, dict) or item.get("verification_status") != "manual_review_required_pending_extraction":
                          return False
                      validation = item.get("source_validation")
                      if not isinstance(validation, dict):
                          validation = {}
                      try:
                          evidence_attempts = int(item.get("core_financial_extraction_evidence_attempt_count") or 0)
                      except (TypeError, ValueError):
                          evidence_attempts = 0
                      return (
                          item.get("core_financial_extraction_manual_terminal") is True
                          or validation.get("manual_review_blocking_automatic_extraction") is True
                          or validation.get("automatic_extraction_exhausted") is True
                          or evidence_attempts >= 3
                      )

                  core_pending = any(
                      isinstance(item, dict)
                      and item.get("verification_status") in {
                          "auto_pending_extraction",
                          "manual_review_required_pending_extraction",
                      }
                      and not terminal_manual_extraction(item)
                      for item in items
                  )
                  details_pending = any(
                      isinstance(item, dict)
                      and re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or ""))
                      and item.get("total_assets") is not None
                      and item.get("net_profit") is not None
                      and not item.get("financial_line_items_status")
                      for item in items
                  )
                  stale_details = any(
                      isinstance(item, dict)
                      and re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or ""))
                      and item.get("financial_line_items_status")
                      and item.get("financial_line_items_status") not in {"manual_review_required", "manual_review_required_pending_extraction", "no_detail_fields_matched_pending_manual_review"}
                      and item.get("financial_line_items_schema_version") != "2026-10-27-other-statements-source-fields-v10"
                      for item in items
                  )
                  statement_pages_pending = ticker_has_ocr_gap(symbol, items)
                  if core_pending or details_pending or stale_details or statement_pages_pending:
                      selected = symbol
                      break
          # If the current ticker has a queued/failed archive job, hand it to the
          # collector after this one-report OCR run instead of dispatching another
          # OCR run that could replace the collector's pending concurrency slot.
          queue = load_json(Path("config/report-queue.json")) or {}
          collector_symbol = ""
          for job in queue.get("jobs", []):
              if not isinstance(job, dict) or str(job.get("symbol") or "").strip().upper() != selected:
                  continue
              status = str(job.get("status") or "")
              try:
                  attempts = int(job.get("attempts") or 0)
              except (TypeError, ValueError):
                  attempts = 0

              # Resume a ticker job when its latest catalog scan is already
              # marked needs_review but it still contains a bounded-retryable
              # download_error (for example, a temporary Vietstock PDF 404).
              # This handoff pauses OCR advancement so the queue head is retried
              # before moving to any other ticker.
              failed = {}
              successful = set()
              for record in job.get("downloadedFiles", []) or []:
                  if not isinstance(record, dict):
                      continue
                  url = str(record.get("url") or record.get("final_url") or "").strip()
                  if not url:
                      continue
                  if record.get("status") == "downloaded_needs_review":
                      successful.add(url)
                  elif record.get("status") == "download_error":
                      state = failed.setdefault(url, {"attempts": 0, "last_attempt": 0.0})
                      try:
                          state["attempts"] += max(1, int(record.get("attempt_number") or 1))
                      except (TypeError, ValueError):
                          state["attempts"] += 1
                      stamp = record.get("attempted_at") or record.get("failed_at") or record.get("downloaded_at")
                      if stamp:
                          try:
                              state["last_attempt"] = max(
                                  float(state.get("last_attempt") or 0),
                                  datetime.fromisoformat(str(stamp).replace("Z", "+00:00")).timestamp()
                              )
                          except (TypeError, ValueError, OSError):
                              pass
              now_epoch = datetime.now(timezone.utc).timestamp()
              retryable_failure = any(
                  url not in successful
                  and state["attempts"] < 3
                  and (
                      not state["last_attempt"]
                      or now_epoch - state["last_attempt"] >= 30 * 60
                  )
                  for url, state in failed.items()
              )
              if status == "queued" or (status == "failed" and attempts < 3) or (status == "needs_review" and retryable_failure):
                  collector_symbol = selected
                  break
          pause_ocr_chain = bool(collector_symbol)
          print(f"Selected ticker for OCR: {selected or '(none; queue held or next ticker needs a snapshot)'}")
          print(f"Next ticker requiring bootstrap, if any: {bootstrap_symbol or '(none)'}")
          print(f"Pending collector handoff: {collector_symbol or '(none)'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"symbol={selected}\n")
              handle.write(f"bootstrap_symbol={bootstrap_symbol}\n")
              handle.write(f"collector_symbol={collector_symbol}\n")
              handle.write(f"pause_ocr_chain={'true' if pause_ocr_chain else 'false'}\n")
          PY

  ocr:
    needs: select-ticker
    outputs:
      saved: ${{ steps.save_selected_ticker.outputs.saved }}
    if: ${{ needs['select-ticker'].outputs.symbol != '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout only the selected ticker's report archive
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/securities.json
            /config/report-queue.json
            /data/financials-*.json
            /.github/scripts/ocr-stored-reports.py
            /.github/scripts/requirements-report-worker.txt
            /.github/scripts/validate-report-queue.cjs
            /scripts/enrich-financial-categories.py
            /scripts/validate-bank-reconciliation.py
            /scripts/validate-financials.mjs
            /scripts/update-report-checkpoint.py
            /reports/library.json
            /reports/processing-checkpoint.json
            /reports/raw/${{ needs['select-ticker'].outputs.symbol }}/**

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: pip install -r .github/scripts/requirements-report-worker.txt

      - name: Compile financial extraction and validation scripts
        run: python -m py_compile scripts/enrich-financial-categories.py scripts/validate-bank-reconciliation.py scripts/update-report-checkpoint.py

      - name: Preflight the next report for native PDF text
        id: ocr_preflight
        env:
          REPORT_OCR_SYMBOL: ${{ needs['select-ticker'].outputs.symbol }}
          REPORT_OCR_MAX_PAGES: ${{ github.event.inputs.max_pages || (github.event_name == 'push' && '18') || '18' }}
          REPORT_OCR_RESCAN_PAGES: ${{ github.event.inputs.rescan_pages || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, runpy, tempfile, zipfile
          from pathlib import Path
          from pypdf import PdfReader

          worker = runpy.run_path(".github/scripts/ocr-stored-reports.py")
          symbol = os.environ["REPORT_OCR_SYMBOL"]
          archives = worker["symbol_report_archives"](symbol)
          reports_dir = worker["REPORTS"]
          max_pages = worker["MAX_PAGES"]
          force_pages = worker["FORCE_RESCAN_PAGES"]
          native_work = False
          needs_tools = False
          inspected_path = None

          def inspect_pdf(pdf_path, payload):
              global native_work, needs_tools
              try:
                  reader = PdfReader(str(pdf_path), strict=False)
                  page_count = len(reader.pages)
              except Exception:
                  return
              limit = min(page_count, max_pages)
              old_pages = {
                  int(p.get("page")): p for p in payload.get("pages", [])
                  if isinstance(p, dict) and str(p.get("page", "")).isdigit()
              }
              forced = {
                  n for n in force_pages if 1 <= n <= limit
                  and (n not in old_pages or worker["needs_ocr_rescan"](old_pages[n]))
              }
              missing = (set(range(1, limit + 1)) - set(old_pages)) | forced
              if not missing:
                  return
              targets = {n for n in missing if n not in old_pages}
              native_pages, _remaining = worker["extract_native_pdf_pages"](pdf_path, targets)
              if native_pages:
                  native_work = True
              # Explicit rescans need OCR. Otherwise try all native-text pages first;
              # install system OCR only when no pending page has usable native text.
              if forced:
                  needs_tools = True
              elif not native_pages:
                  needs_tools = True

          for period, archive_path in archives:
              sidecar = Path(str(archive_path) + ".extracted.json")
              payload = worker["load_json"](sidecar) or {}
              if not worker["_extraction_has_missing_pages"](payload):
                  continue
              inspected_path = str(archive_path.relative_to(worker["ROOT"]))
              if archive_path.suffix.lower() == ".pdf":
                  inspect_pdf(archive_path, payload)
              elif archive_path.suffix.lower() == ".zip":
                  try:
                      with zipfile.ZipFile(archive_path) as archive:
                          available = set(archive.namelist())
                          for member in payload.get("members", []):
                              if not isinstance(member, dict) or member.get("kind") != "pdf":
                                  continue
                              name = member.get("name")
                              if not name or name not in available:
                                  continue
                              with tempfile.TemporaryDirectory(prefix="so-lieu-preflight-") as temp_dir:
                                  inner_pdf = Path(temp_dir) / "member.pdf"
                                  inner_pdf.write_bytes(archive.read(name))
                                  inspect_pdf(inner_pdf, member)
                  except Exception as exc:
                      print(f"Preflight ZIP warning: {exc}")
              break

          # If this report has some native-readable pages, save those first.
          # On the next single-report run, only scanned pages remain and OCR
          # tools will be installed then, avoiding an apt-get call on every run.
          if native_work and not force_pages:
              needs_tools = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"needs_ocr={'true' if needs_tools else 'false'}\n")
          print(json.dumps({
              "symbol": symbol,
              "next_report": inspected_path,
              "native_text_available": native_work,
              "needs_ocr_tools": needs_tools,
          }, ensure_ascii=False))
          PY

      - name: Install OCR tools only when the next report is scanned
        if: steps.ocr_preflight.outputs.needs_ocr == 'true'
        timeout-minutes: 12
        continue-on-error: true
        shell: bash
        run: |
          set -u
          if command -v pdftoppm >/dev/null 2>&1 \
            && command -v tesseract >/dev/null 2>&1 \
            && tesseract --list-langs 2>/dev/null | grep -qx 'vie' \
            && tesseract --list-langs 2>/dev/null | grep -qx 'eng'; then
            echo "Poppler and Vietnamese/English Tesseract are ready."
            exit 0
          fi
          if ! timeout 120s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update; then
            echo "::warning::OCR package index unavailable within 120 seconds."
            exit 0
          fi
          if ! timeout 480s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y poppler-utils tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng; then
            echo "::warning::OCR tools could not be installed within 480 seconds."
            exit 0
          fi

      - name: Verify OCR binaries before processing scanned pages
        if: steps.ocr_preflight.outputs.needs_ocr == 'true'
        shell: bash
        run: |
          set -euo pipefail
          command -v pdftoppm >/dev/null
          command -v tesseract >/dev/null
          tesseract --list-langs 2>/dev/null | grep -qx 'vie'
          tesseract --list-langs 2>/dev/null | grep -qx 'eng'

      - name: Validate queue before OCR
        run: node .github/scripts/validate-report-queue.cjs

      - name: OCR up to two reports from the selected ticker
        id: run_ocr
        env:
          REPORT_OCR_SYMBOL: ${{ needs['select-ticker'].outputs.symbol }}
          REPORT_OCR_MAX_PAGES: ${{ github.event.inputs.max_pages || (github.event_name == 'push' && '18') || '18' }}
          REPORT_OCR_MAX_REPORTS: "2"
          REPORT_OCR_DPI: "240"
          REPORT_OCR_RESCAN_PAGES: ${{ github.event.inputs.rescan_pages || '' }}
        run: python .github/scripts/ocr-stored-reports.py

      - name: Validate queue after OCR
        run: node .github/scripts/validate-report-queue.cjs

      - name: Enrich only the selected ticker's quarterly categories
        env:
          FINANCIAL_ENRICH_SYMBOL: ${{ needs['select-ticker'].outputs.symbol }}
        run: python scripts/enrich-financial-categories.py

      - name: Validate enriched financial snapshots
        run: node scripts/validate-financials.mjs

      - name: Validate bank balance-sheet extraction regressions
        run: python scripts/validate-bank-reconciliation.py

      - name: Commit selected ticker's OCR text and detail fields
        id: save_selected_ticker
        env:
          REPORT_OCR_SYMBOL: ${{ needs['select-ticker'].outputs.symbol }}
          REPORT_OCR_MAX_PAGES: ${{ github.event.inputs.max_pages || (github.event_name == 'push' && '18') || '18' }}
          REPORT_OCR_RESCAN_PAGES: ${{ github.event.inputs.rescan_pages || '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "data/financials-${REPORT_OCR_SYMBOL}.json"
          if [ -d "reports/raw/${REPORT_OCR_SYMBOL}" ]; then
            git add -A -- "reports/raw/${REPORT_OCR_SYMBOL}"
          fi
          if git diff --cached --quiet; then
            echo "No new OCR/detail fields for ${REPORT_OCR_SYMBOL}; close unresolved items for manual review and advance the queue."
            REPORT_OCR_SKIP_UNCONFIRMED=true REPORT_OCR_CHANGED_PATHS="" \
              python scripts/update-report-checkpoint.py "${REPORT_OCR_SYMBOL}"
          else
            REPORT_OCR_CHANGED_PATHS="$(git diff --cached --name-only)" \
              python scripts/update-report-checkpoint.py "${REPORT_OCR_SYMBOL}"
          fi
          git add -A -- "data/financials-${REPORT_OCR_SYMBOL}.json"
          git add -- reports/processing-checkpoint.json

          # Preserve OCR sidecars before any rebase: the checkpoint may have
          # advanced concurrently even though no other worker touched this ticker.
          if [ -d "reports/raw/${REPORT_OCR_SYMBOL}" ]; then
            tar -czf "/tmp/selected-ticker-raw-${REPORT_OCR_SYMBOL}.tar.gz" "reports/raw/${REPORT_OCR_SYMBOL}"
          fi

          if git diff --cached --name-only | grep -qv '^reports/processing-checkpoint\.json$'; then
            git commit -m "OCR and enrich ${REPORT_OCR_SYMBOL} financial reports"
          else
            git commit -m "Advance checkpoint for ${REPORT_OCR_SYMBOL} financial reports"
          fi
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                pushed=true
                echo "saved=true" >> "$GITHUB_OUTPUT"
                break
              fi
            else
              echo "::warning::Concurrent update detected; restoring the selected ticker's preserved OCR sidecars and recomputing its details."
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              if [ -s "/tmp/selected-ticker-raw-${REPORT_OCR_SYMBOL}.tar.gz" ]; then
                tar -xzf "/tmp/selected-ticker-raw-${REPORT_OCR_SYMBOL}.tar.gz" -C .
              fi
              node .github/scripts/validate-report-queue.cjs
              FINANCIAL_ENRICH_SYMBOL="${REPORT_OCR_SYMBOL}" python scripts/enrich-financial-categories.py
              node scripts/validate-financials.mjs
              git add -A -- "data/financials-${REPORT_OCR_SYMBOL}.json"
              if [ -d "reports/raw/${REPORT_OCR_SYMBOL}" ]; then
                git add -A -- "reports/raw/${REPORT_OCR_SYMBOL}"
              fi
              if git diff --cached --quiet; then
                echo "No additional safe fields for ${REPORT_OCR_SYMBOL}; close unresolved items for manual review and advance the queue."
                REPORT_OCR_SKIP_UNCONFIRMED=true REPORT_OCR_CHANGED_PATHS="" \
                  python scripts/update-report-checkpoint.py "${REPORT_OCR_SYMBOL}"
              else
                REPORT_OCR_CHANGED_PATHS="$(git diff --cached --name-only)" \
                  python scripts/update-report-checkpoint.py "${REPORT_OCR_SYMBOL}"
              fi
              git add -A -- "data/financials-${REPORT_OCR_SYMBOL}.json"
              git add -- reports/processing-checkpoint.json
              if git diff --cached --name-only | grep -qv '^reports/processing-checkpoint\.json$'; then
                git commit -m "Reconcile ${REPORT_OCR_SYMBOL} financial report details"
              else
                git commit -m "Advance checkpoint for ${REPORT_OCR_SYMBOL} financial reports"
              fi
            fi
            sleep $((attempt * 2))
          done

          if [ "${pushed}" != "true" ]; then
            echo "::error::Could not push selected ticker's OCR and detail fields after five safe attempts."
            exit 1
          fi

      - name: Upload selected ticker OCR summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: financial-report-ocr-summary-${{ needs['select-ticker'].outputs.symbol }}
          path: reports/raw/${{ needs['select-ticker'].outputs.symbol }}/**/*.extracted.json
          if-no-files-found: ignore
          retention-days: 30

  advance:
    needs: [select-ticker, ocr]
    if: ${{ needs['select-ticker'].outputs.symbol != '' && needs.ocr.result == 'success' && needs.ocr.outputs.saved == 'true' && needs['select-ticker'].outputs.pause_ocr_chain != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the next one-report run only after the previous ticker's report was pushed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ocr-financial-reports.yml/dispatches" -f ref=main -f inputs[max_pages]=18

  handoff-to-collector:
    needs: [select-ticker, ocr]
    if: ${{ always() && needs['select-ticker'].result == 'success' && needs['select-ticker'].outputs.collector_symbol != '' && (needs.ocr.result == 'skipped' || needs.ocr.outputs.saved != 'true' || needs['select-ticker'].outputs.pause_ocr_chain == 'true') && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Hand the current ticker to the queued collector before advancing OCR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Queue head is ${{ needs['select-ticker'].outputs.collector_symbol }}; dispatching only this ticker to the collector."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/collect-financial-reports.yml/dispatches" -f ref=main -f "inputs[symbol]=${{ needs['select-ticker'].outputs.collector_symbol }}"

  bootstrap-next:
    needs: [select-ticker, ocr]
    if: ${{ always() && needs['select-ticker'].result == 'success' && needs['select-ticker'].outputs.symbol == '' && needs['select-ticker'].outputs.bootstrap_symbol != '' && needs['select-ticker'].outputs.collector_symbol == '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Bootstrap exactly the next missing ticker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "The OCR queue is at ${{ needs['select-ticker'].outputs.bootstrap_symbol }}; dispatching one-ticker Vietstock sync."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-vietstock-financials.yml/dispatches" -f ref=main

