name: OCR Financial Report Archive

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/ocr-stored-reports.py"
      - "scripts/enrich-financial-categories.py"
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_run:
    workflows: ["Collect Financial Reports"]
    types: [completed]
  workflow_dispatch:
    inputs:
      symbol:
        description: Ticker to OCR; blank selects the first incomplete ticker in configuration order
        required: false
        default: ""
      max_pages:
        description: Pages per report to OCR (covers the main financial statements; use a larger number only when needed)
        required: false
        default: "8"
      rescan_pages:
        description: Comma-separated page numbers to re-OCR even if text is already present
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Only successful collector runs should join the shared write queue.
  # A skipped OCR run from a cancelled/failed collector must not evict a queued collector.
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && 'so-lieu-financial-data-noop-v1' || 'so-lieu-financial-data-writes-v1' }}
  cancel-in-progress: false

jobs:
  select-ticker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      symbol: ${{ steps.pick.outputs.symbol }}
    steps:
      - name: Checkout ticker registry and snapshot headers only
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/securities.json
            /data/financials-*.json
            /reports/raw/**/*.extracted.json

      - name: Pick the first incomplete ticker in configured order
        id: pick
        env:
          REQUESTED_SYMBOL: ${{ github.event.inputs.symbol || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          config = json.loads(Path("config/securities.json").read_text(encoding="utf-8"))
          symbols = [
              str(item.get("symbol") or "").strip().upper()
              for item in config.get("securities", [])
              if isinstance(item, dict) and item.get("enabled") is not False and item.get("symbol")
          ]

          def load_json(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return None

          def payload_needs_pages(payload):
              if not isinstance(payload, dict):
                  return False
              if payload.get("kind") == "pdf":
                  documents = [payload]
              elif payload.get("kind") == "zip":
                  documents = [member for member in payload.get("members", []) if isinstance(member, dict) and member.get("kind") == "pdf"]
              else:
                  return False
              for document in documents:
                  try:
                      page_count = int(document.get("page_count") or 0)
                  except (TypeError, ValueError):
                      page_count = 0
                  target_count = min(max(page_count, 0), 14)
                  pages = {
                      int(page.get("page")): page
                      for page in document.get("pages", [])
                      if isinstance(page, dict) and str(page.get("page", "")).isdigit()
                  }
                  if any(number not in pages for number in range(1, target_count + 1)):
                      return True
                  for number in (10, 11):
                      page = pages.get(number)
                      if page is None or not page.get("forced_rescan_completed"):
                          if 1 <= number <= target_count:
                              return True
                      if page and page.get("forced_rescan_completed"):
                          try:
                              score = float(page.get("ocr_quality_score") or 0)
                              attempts = int(page.get("forced_rescan_count") or 1)
                          except (TypeError, ValueError):
                              score, attempts = 0.0, 1
                          if score < 0.34 and attempts < 3:
                              return True
              return False

          def ticker_has_ocr_gap(symbol, items):
              for item in items:
                  if not isinstance(item, dict) or not re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or "")):
                      continue
                  source = str(item.get("source_archive_file") or "").strip()
                  if not source:
                      continue
                  archive_path = (Path(source)).resolve()
                  try:
                      archive_path.relative_to(Path("reports/raw").resolve())
                  except ValueError:
                      continue
                  sidecar = Path(str(archive_path) + ".extracted.json")
                  extracted = load_json(sidecar)
                  if extracted is not None and payload_needs_pages(extracted):
                      return True
              return False

          requested = os.environ.get("REQUESTED_SYMBOL", "").strip().upper()
          if requested:
              if requested not in symbols:
                  raise SystemExit(f"Ticker {requested} is not enabled in config/securities.json")
              selected = requested
          else:
              selected = ""
              for symbol in symbols:
                  path = Path("data") / f"financials-{symbol}.json"
                  snapshot = load_json(path)
                  if snapshot is None:
                      # A missing snapshot belongs to the sync worker. Keep the queue
                      # on this symbol rather than paying to check out other archives.
                      break
                  items = snapshot.get("items") or []
                  if not items:
                      attempts = int(snapshot.get("bootstrap_attempt_count") or 0)
                      terminal = (
                          attempts >= 3
                          and snapshot.get("sync_status") in {
                              "fetch_failed", "no_quarterly_consolidated_records_returned",
                              "needs_manual_review_no_quarterly_data"
                          }
                      )
                      if terminal:
                          continue
                      break
                  core_pending = any(
                      isinstance(item, dict)
                      and item.get("verification_status") == "auto_pending_extraction"
                      for item in items
                  )
                  details_pending = any(
                      isinstance(item, dict)
                      and re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or ""))
                      and item.get("total_assets") is not None
                      and item.get("net_profit") is not None
                      and not item.get("financial_line_items_status")
                      for item in items
                  )
                  stale_details = any(
                      isinstance(item, dict)
                      and re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or ""))
                      and item.get("financial_line_items_status")
                      and item.get("financial_line_items_status") not in {"manual_review_required", "manual_review_required_pending_extraction", "no_detail_fields_matched_pending_manual_review"}
                      and item.get("financial_line_items_schema_version") != "2026-10-22-bank-statement-qc-v4"
                      for item in items
                  )
                  if core_pending or details_pending or stale_details:
                      # Select the queue-head ticker even if OCR sidecars have no
                      # page gaps: the enrichment step must re-parse those pages
                      # with the current accounting/unit validation rules.
                      selected = symbol
                      break
          print(f"Selected ticker for OCR: {selected or '(no OCR page gaps; queue remains on first incomplete ticker)'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"symbol={selected}\n")
          PY

  ocr:
    needs: select-ticker
    if: ${{ needs.select-ticker.outputs.symbol != '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout only the selected ticker's report archive
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/securities.json
            /config/report-queue.json
            /data/financials-*.json
            /.github/scripts/ocr-stored-reports.py
            /.github/scripts/requirements-report-worker.txt
            /.github/scripts/validate-report-queue.cjs
            /scripts/enrich-financial-categories.py
            /scripts/validate-financials.mjs
            /reports/library.json
            /reports/raw/${{ needs.select-ticker.outputs.symbol }}/**

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OCR system tools only when missing
        shell: bash
        run: |
          set -euo pipefail
          if command -v pdftoppm >/dev/null 2>&1 \
            && command -v tesseract >/dev/null 2>&1 \
            && tesseract --list-langs 2>/dev/null | grep -qx 'vie' \
            && tesseract --list-langs 2>/dev/null | grep -qx 'eng'; then
            echo "Poppler and Vietnamese/English Tesseract languages are already available."
          else
            sudo apt-get update
            sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng
          fi

      - name: Install extraction dependencies
        run: pip install -r .github/scripts/requirements-report-worker.txt

      - name: Validate queue before OCR
        run: node .github/scripts/validate-report-queue.cjs

      - name: OCR one report from selected ticker
        id: run_ocr
        env:
          REPORT_OCR_SYMBOL: ${{ needs.select-ticker.outputs.symbol }}
          REPORT_OCR_MAX_PAGES: ${{ github.event.inputs.max_pages || '8' }}
          REPORT_OCR_MAX_REPORTS: "1"
          REPORT_OCR_DPI: "280"
          REPORT_OCR_RESCAN_PAGES: ${{ github.event.inputs.rescan_pages || '' }}
        run: python .github/scripts/ocr-stored-reports.py

      - name: Validate queue after OCR
        run: node .github/scripts/validate-report-queue.cjs

      - name: Enrich only the selected ticker's quarterly categories
        env:
          FINANCIAL_ENRICH_SYMBOL: ${{ needs.select-ticker.outputs.symbol }}
        run: python scripts/enrich-financial-categories.py

      - name: Validate enriched financial snapshots
        run: node scripts/validate-financials.mjs

      - name: Commit selected ticker's OCR text and detail fields
        env:
          REPORT_OCR_SYMBOL: ${{ needs.select-ticker.outputs.symbol }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "data/financials-${REPORT_OCR_SYMBOL}.json"
          if [ -d "reports/raw/${REPORT_OCR_SYMBOL}" ]; then
            git add -A -- "reports/raw/${REPORT_OCR_SYMBOL}"
          fi
          if git diff --cached --quiet; then
            echo "No OCR or detail-field changes for ${REPORT_OCR_SYMBOL}."
            exit 0
          fi

          git commit -m "OCR and enrich ${REPORT_OCR_SYMBOL} financial reports"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
            else
              echo "::warning::Concurrent update detected; reapplying only the selected ticker's archive patch and recomputing its details."
              git diff HEAD^ HEAD -- "reports/raw/${REPORT_OCR_SYMBOL}" > /tmp/selected-ticker-report.patch || true
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              if [ -s /tmp/selected-ticker-report.patch ] && [ -d "reports/raw/${REPORT_OCR_SYMBOL}" ]; then
                git apply --3way /tmp/selected-ticker-report.patch || true
              fi
              node .github/scripts/validate-report-queue.cjs
              FINANCIAL_ENRICH_SYMBOL="${REPORT_OCR_SYMBOL}" python scripts/enrich-financial-categories.py
              node scripts/validate-financials.mjs
              git add -A -- "data/financials-${REPORT_OCR_SYMBOL}.json"
              if [ -d "reports/raw/${REPORT_OCR_SYMBOL}" ]; then
                git add -A -- "reports/raw/${REPORT_OCR_SYMBOL}"
              fi
              if git diff --cached --quiet; then
                echo "No additional safe fields found after recomputing ${REPORT_OCR_SYMBOL}."
                pushed=true
                break
              fi
              git commit -m "Reconcile ${REPORT_OCR_SYMBOL} financial report details"
            fi
            sleep $((attempt * 2))
          done

          if [ "${pushed}" != "true" ]; then
            echo "::error::Could not push selected ticker's OCR and detail fields after five safe attempts."
            exit 1
          fi

      - name: Upload selected ticker OCR summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: financial-report-ocr-summary-${{ needs.select-ticker.outputs.symbol }}
          path: reports/raw/${{ needs.select-ticker.outputs.symbol }}/**/*.extracted.json
          if-no-files-found: ignore
          retention-days: 30
