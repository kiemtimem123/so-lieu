name: OCR Financial Report Archive

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/ocr-stored-reports.py"
      - "scripts/enrich-financial-categories.py"
      - "config/securities.json"
  schedule:
    - cron: "*/30 * * * *"
    - cron: "5 3 * * *"
  workflow_dispatch:
    inputs:
      symbol:
        description: Ticker to OCR; blank selects the first incomplete ticker in configuration order
        required: false
        default: ""
      max_pages:
        description: Pages per report to OCR (covers the main financial statements; use a larger number only when needed)
        required: false
        default: "14"
      rescan_pages:
        description: Comma-separated page numbers to re-OCR even if text is already present
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: so-lieu-financial-data-writes-v2
  cancel-in-progress: false

jobs:
  select-ticker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    outputs:
      symbol: ${{ steps.pick.outputs.symbol }}
      bootstrap_symbol: ${{ steps.pick.outputs.bootstrap_symbol }}
      collector_symbol: ${{ steps.pick.outputs.collector_symbol }}
      pause_ocr_chain: ${{ steps.pick.outputs.pause_ocr_chain }}
    steps:
      - name: Checkout ticker registry and snapshot headers only
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/securities.json
            /config/report-queue.json
            /data/financials-*.json
            /reports/raw/**/*.extracted.json

      - name: Pick the first incomplete ticker in configured order
        id: pick
        env:
          REQUESTED_SYMBOL: ${{ github.event.inputs.symbol || '' }}
          TARGET_MAX_PAGES: ${{ github.event.inputs.max_pages || '14' }}
          TARGET_RESCAN_PAGES: ${{ github.event.inputs.rescan_pages || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          config = json.loads(Path("config/securities.json").read_text(encoding="utf-8"))
          symbols = [
              str(item.get("symbol") or "").strip().upper()
              for item in config.get("securities", [])
              if isinstance(item, dict) and item.get("enabled") is not False and item.get("symbol")
          ]

          def load_json(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return None

          def payload_needs_pages(payload):
              if not isinstance(payload, dict):
                  return False
              if payload.get("kind") == "pdf":
                  documents = [payload]
              elif payload.get("kind") == "zip":
                  documents = [member for member in payload.get("members", []) if isinstance(member, dict) and member.get("kind") == "pdf"]
              else:
                  return False
              try:
                  page_limit = min(18, max(1, int(os.environ.get("TARGET_MAX_PAGES", "8"))))
              except (TypeError, ValueError):
                  page_limit = 8
              rescan_pages = {
                  int(value.strip())
                  for value in os.environ.get("TARGET_RESCAN_PAGES", "").split(",")
                  if value.strip().isdigit()
              }
              for document in documents:
                  try:
                      page_count = int(document.get("page_count") or 0)
                  except (TypeError, ValueError):
                      page_count = 0
                  target_count = min(max(page_count, 0), page_limit)
                  pages = {
                      int(page.get("page")): page
                      for page in document.get("pages", [])
                      if isinstance(page, dict) and str(page.get("page", "")).isdigit()
                  }
                  if any(number not in pages for number in range(1, target_count + 1)):
                      return True
                  for number in rescan_pages:
                      if not 1 <= number <= target_count:
                          continue
                      page = pages.get(number)
                      if page is None or not page.get("forced_rescan_completed"):
                          return True
                      try:
                          score = float(page.get("ocr_quality_score") or 0)
                          attempts = int(page.get("forced_rescan_count") or 1)
                      except (TypeError, ValueError):
                          score, attempts = 0.0, 1
                      if score < 0.34 and attempts < 3:
                          return True
              return False

          def ticker_has_ocr_gap(symbol, items):
              for item in items:
                  if not isinstance(item, dict) or not re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or "")):
                      continue
                  source = str(item.get("source_archive_file") or "").strip()
                  if not source:
                      continue
                  archive_path = (Path(source)).resolve()
                  try:
                      archive_path.relative_to(Path("reports/raw").resolve())
                  except ValueError:
                      continue
                  sidecar = Path(str(archive_path) + ".extracted.json")
                  extracted = load_json(sidecar)
                  if extracted is not None and payload_needs_pages(extracted):
                      return True
              return False

          requested = os.environ.get("REQUESTED_SYMBOL", "").strip().upper()
          bootstrap_symbol = ""
          if requested:
              if requested not in symbols:
                  raise SystemExit(f"Ticker {requested} is not enabled in config/securities.json")
              selected = requested
          else:
              selected = ""
              now = __import__("datetime").datetime.now(__import__("datetime").timezone.utc).timestamp()
              for symbol in symbols:
                  path = Path("data") / f"financials-{symbol}.json"
                  snapshot = load_json(path)
                  if snapshot is None:
                      # Bootstrap only the first missing ticker, after all earlier
                      # configured symbols have completed their extraction/review state.
                      bootstrap_symbol = symbol
                      break
                  if snapshot.get("bootstrap_status") in {"complete", "complete_needs_manual_review"}:
                      continue
                  items = snapshot.get("items") or []
                  if not items:
                      attempts = int(snapshot.get("bootstrap_attempt_count") or 0)
                      terminal = (
                          attempts >= 3
                          and snapshot.get("sync_status") in {
                              "fetch_failed", "no_quarterly_consolidated_records_returned",
                              "needs_manual_review_no_quarterly_data"
                          }
                      )
                      if terminal:
                          continue
                      stamp = snapshot.get("bootstrap_last_attempt_at") or snapshot.get("fetchedAt")
                      age = 10**12
                      if stamp:
                          try:
                              from datetime import datetime, timezone
                              age = now - datetime.fromisoformat(str(stamp).replace("Z", "+00:00")).timestamp()
                          except (TypeError, ValueError, OSError):
                              pass
                      if age >= 30 * 60:
                          bootstrap_symbol = symbol
                          print(f"Bootstrap retry eligible for {symbol}; last attempt cooldown has expired.")
                      else:
                          print(f"Hold queue at {symbol}; waiting for its 30-minute retry cooldown.")
                      break
                  core_pending = any(
                      isinstance(item, dict)
                      and item.get("verification_status") == "auto_pending_extraction"
                      for item in items
                  )
                  details_pending = any(
                      isinstance(item, dict)
                      and re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or ""))
                      and item.get("total_assets") is not None
                      and item.get("net_profit") is not None
                      and not item.get("financial_line_items_status")
                      for item in items
                  )
                  stale_details = any(
                      isinstance(item, dict)
                      and re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or ""))
                      and item.get("financial_line_items_status")
                      and item.get("financial_line_items_status") not in {"manual_review_required", "manual_review_required_pending_extraction", "no_detail_fields_matched_pending_manual_review"}
                      and item.get("financial_line_items_schema_version") != "2026-10-22-bank-statement-qc-v4"
                      for item in items
                  )
                  statement_pages_pending = ticker_has_ocr_gap(symbol, items)
                  if core_pending or details_pending or stale_details or statement_pages_pending:
                      selected = symbol
                      break
          # If the current ticker has a queued/failed archive job, hand it to the
          # collector after this one-report OCR run instead of dispatching another
          # OCR run that could replace the collector's pending concurrency slot.
          queue = load_json(Path("config/report-queue.json")) or {}
          collector_symbol = ""
          for job in queue.get("jobs", []):
              if not isinstance(job, dict) or str(job.get("symbol") or "").strip().upper() != selected:
                  continue
              status = str(job.get("status") or "")
              try:
                  attempts = int(job.get("attempts") or 0)
              except (TypeError, ValueError):
                  attempts = 0
              if status == "queued" or (status == "failed" and attempts < 3):
                  collector_symbol = selected
                  break
          pause_ocr_chain = bool(collector_symbol)
          print(f"Selected ticker for OCR: {selected or '(none; queue held or next ticker needs a snapshot)'}")
          print(f"Next ticker requiring bootstrap, if any: {bootstrap_symbol or '(none)'}")
          print(f"Pending collector handoff: {collector_symbol or '(none)'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"symbol={selected}\n")
              handle.write(f"bootstrap_symbol={bootstrap_symbol}\n")
              handle.write(f"collector_symbol={collector_symbol}\n")
              handle.write(f"pause_ocr_chain={'true' if pause_ocr_chain else 'false'}\n")
          PY

  ocr:
    needs: select-ticker
    outputs:
      saved: ${{ steps.save_selected_ticker.outputs.saved }}
    if: ${{ needs['select-ticker'].outputs.symbol != '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout only the selected ticker's report archive
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/securities.json
            /config/report-queue.json
            /data/financials-*.json
            /.github/scripts/ocr-stored-reports.py
            /.github/scripts/requirements-report-worker.txt
            /.github/scripts/validate-report-queue.cjs
            /scripts/enrich-financial-categories.py
            /scripts/validate-financials.mjs
            /reports/library.json
            /reports/raw/${{ needs['select-ticker'].outputs.symbol }}/**

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: pip install -r .github/scripts/requirements-report-worker.txt

      - name: Preflight the next report for native PDF text
        id: ocr_preflight
        env:
          REPORT_OCR_SYMBOL: ${{ needs['select-ticker'].outputs.symbol }}
          REPORT_OCR_MAX_PAGES: ${{ github.event.inputs.max_pages || '14' }}
          REPORT_OCR_RESCAN_PAGES: ${{ github.event.inputs.rescan_pages || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, runpy, tempfile, zipfile
          from pathlib import Path
          from pypdf import PdfReader

          worker = runpy.run_path(".github/scripts/ocr-stored-reports.py")
          symbol = os.environ["REPORT_OCR_SYMBOL"]
          archives = worker["symbol_report_archives"](symbol)
          reports_dir = worker["REPORTS"]
          max_pages = worker["MAX_PAGES"]
          force_pages = worker["FORCE_RESCAN_PAGES"]
          native_work = False
          needs_tools = False
          inspected_path = None

          def inspect_pdf(pdf_path, payload):
              global native_work, needs_tools
              try:
                  reader = PdfReader(str(pdf_path), strict=False)
                  page_count = len(reader.pages)
              except Exception:
                  return
              limit = min(page_count, max_pages)
              old_pages = {
                  int(p.get("page")): p for p in payload.get("pages", [])
                  if isinstance(p, dict) and str(p.get("page", "")).isdigit()
              }
              forced = {
                  n for n in force_pages if 1 <= n <= limit
                  and (n not in old_pages or worker["needs_ocr_rescan"](old_pages[n]))
              }
              missing = (set(range(1, limit + 1)) - set(old_pages)) | forced
              if not missing:
                  return
              targets = {n for n in missing if n not in old_pages}
              native_pages, _remaining = worker["extract_native_pdf_pages"](pdf_path, targets)
              if native_pages:
                  native_work = True
              # Explicit rescans need OCR. Otherwise try all native-text pages first;
              # install system OCR only when no pending page has usable native text.
              if forced:
                  needs_tools = True
              elif not native_pages:
                  needs_tools = True

          for period, archive_path in archives:
              sidecar = Path(str(archive_path) + ".extracted.json")
              payload = worker["load_json"](sidecar) or {}
              if not worker["_extraction_has_missing_pages"](payload):
                  continue
              inspected_path = str(archive_path.relative_to(worker["ROOT"]))
              if archive_path.suffix.lower() == ".pdf":
                  inspect_pdf(archive_path, payload)
              elif archive_path.suffix.lower() == ".zip":
                  try:
                      with zipfile.ZipFile(archive_path) as archive:
                          available = set(archive.namelist())
                          for member in payload.get("members", []):
                              if not isinstance(member, dict) or member.get("kind") != "pdf":
                                  continue
                              name = member.get("name")
                              if not name or name not in available:
                                  continue
                              with tempfile.TemporaryDirectory(prefix="so-lieu-preflight-") as temp_dir:
                                  inner_pdf = Path(temp_dir) / "member.pdf"
                                  inner_pdf.write_bytes(archive.read(name))
                                  inspect_pdf(inner_pdf, member)
                  except Exception as exc:
                      print(f"Preflight ZIP warning: {exc}")
              break

          # If this report has some native-readable pages, save those first.
          # On the next single-report run, only scanned pages remain and OCR
          # tools will be installed then, avoiding an apt-get call on every run.
          if native_work and not force_pages:
              needs_tools = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"needs_ocr={'true' if needs_tools else 'false'}\n")
          print(json.dumps({
              "symbol": symbol,
              "next_report": inspected_path,
              "native_text_available": native_work,
              "needs_ocr_tools": needs_tools,
          }, ensure_ascii=False))
          PY

      - name: Install OCR tools only when the next report is scanned
        if: steps.ocr_preflight.outputs.needs_ocr == 'true'
        timeout-minutes: 6
        continue-on-error: true
        shell: bash
        run: |
          set -u
          if command -v pdftoppm >/dev/null 2>&1 \
            && command -v tesseract >/dev/null 2>&1 \
            && tesseract --list-langs 2>/dev/null | grep -qx 'vie' \
            && tesseract --list-langs 2>/dev/null | grep -qx 'eng'; then
            echo "Poppler and Vietnamese/English Tesseract are ready."
            exit 0
          fi
          if ! timeout 60s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=8 -o Acquire::https::Timeout=8 update; then
            echo "::warning::OCR package index unavailable within 60 seconds; continue with native PDF text and keep the ticker queue unchanged."
            exit 0
          fi
          if ! timeout 220s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=8 -o Acquire::https::Timeout=8 install -y poppler-utils tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng; then
            echo "::warning::OCR tools could not be installed within 220 seconds; continue safely without fabricating data."
            exit 0
          fi

      - name: Validate queue before OCR
        run: node .github/scripts/validate-report-queue.cjs

      - name: OCR one report from selected ticker
        id: run_ocr
        env:
          REPORT_OCR_SYMBOL: ${{ needs['select-ticker'].outputs.symbol }}
          REPORT_OCR_MAX_PAGES: ${{ github.event.inputs.max_pages || '14' }}
          REPORT_OCR_MAX_REPORTS: "1"
          REPORT_OCR_DPI: "280"
          REPORT_OCR_RESCAN_PAGES: ${{ github.event.inputs.rescan_pages || '' }}
        run: python .github/scripts/ocr-stored-reports.py

      - name: Validate queue after OCR
        run: node .github/scripts/validate-report-queue.cjs

      - name: Enrich only the selected ticker's quarterly categories
        env:
          FINANCIAL_ENRICH_SYMBOL: ${{ needs['select-ticker'].outputs.symbol }}
        run: python scripts/enrich-financial-categories.py

      - name: Validate enriched financial snapshots
        run: node scripts/validate-financials.mjs

      - name: Commit selected ticker's OCR text and detail fields
        id: save_selected_ticker
        env:
          REPORT_OCR_SYMBOL: ${{ needs['select-ticker'].outputs.symbol }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "data/financials-${REPORT_OCR_SYMBOL}.json"
          if [ -d "reports/raw/${REPORT_OCR_SYMBOL}" ]; then
            git add -A -- "reports/raw/${REPORT_OCR_SYMBOL}"
          fi
          if git diff --cached --quiet; then
            echo "No OCR or detail-field changes for ${REPORT_OCR_SYMBOL}; stop the chain and let the scheduled retry revisit only unfinished data."
            echo "saved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "OCR and enrich ${REPORT_OCR_SYMBOL} financial reports"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                pushed=true
                echo "saved=true" >> "$GITHUB_OUTPUT"
                break
              fi
            else
              echo "::warning::Concurrent update detected; reapplying only the selected ticker's archive patch and recomputing its details."
              git diff HEAD^ HEAD -- "reports/raw/${REPORT_OCR_SYMBOL}" > /tmp/selected-ticker-report.patch || true
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              if [ -s /tmp/selected-ticker-report.patch ] && [ -d "reports/raw/${REPORT_OCR_SYMBOL}" ]; then
                git apply --3way /tmp/selected-ticker-report.patch || true
              fi
              node .github/scripts/validate-report-queue.cjs
              FINANCIAL_ENRICH_SYMBOL="${REPORT_OCR_SYMBOL}" python scripts/enrich-financial-categories.py
              node scripts/validate-financials.mjs
              git add -A -- "data/financials-${REPORT_OCR_SYMBOL}.json"
              if [ -d "reports/raw/${REPORT_OCR_SYMBOL}" ]; then
                git add -A -- "reports/raw/${REPORT_OCR_SYMBOL}"
              fi
              if git diff --cached --quiet; then
                echo "No additional safe fields found after recomputing ${REPORT_OCR_SYMBOL}; stop the immediate chain."
                echo "saved=false" >> "$GITHUB_OUTPUT"
                pushed=true
                break
              fi
              git commit -m "Reconcile ${REPORT_OCR_SYMBOL} financial report details"
            fi
            sleep $((attempt * 2))
          done

          if [ "${pushed}" != "true" ]; then
            echo "::error::Could not push selected ticker's OCR and detail fields after five safe attempts."
            exit 1
          fi

      - name: Upload selected ticker OCR summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: financial-report-ocr-summary-${{ needs['select-ticker'].outputs.symbol }}
          path: reports/raw/${{ needs['select-ticker'].outputs.symbol }}/**/*.extracted.json
          if-no-files-found: ignore
          retention-days: 30

  advance:
    needs: [select-ticker, ocr]
    if: ${{ needs['select-ticker'].outputs.symbol != '' && needs.ocr.result == 'success' && needs.ocr.outputs.saved == 'true' && needs['select-ticker'].outputs.pause_ocr_chain != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the next one-report run only after the previous ticker's report was pushed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ocr-financial-reports.yml/dispatches" -f ref=main

  handoff-to-collector:
    needs: [select-ticker, ocr]
    if: ${{ always() && needs['select-ticker'].result == 'success' && needs['select-ticker'].outputs.collector_symbol != '' && (needs.ocr.result == 'skipped' || needs.ocr.outputs.saved != 'true' || needs['select-ticker'].outputs.pause_ocr_chain == 'true') && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Hand the current ticker to the queued collector before advancing OCR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Queue head is ${{ needs['select-ticker'].outputs.collector_symbol }}; dispatching the collector instead of another OCR run."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/collect-financial-reports.yml/dispatches" -f ref=main

  bootstrap-next:
    needs: [select-ticker, ocr]
    if: ${{ always() && needs['select-ticker'].result == 'success' && needs['select-ticker'].outputs.symbol == '' && needs['select-ticker'].outputs.bootstrap_symbol != '' && needs['select-ticker'].outputs.collector_symbol == '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Bootstrap exactly the next missing ticker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "The OCR queue is at ${{ needs['select-ticker'].outputs.bootstrap_symbol }}; dispatching one-ticker Vietstock sync."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-vietstock-financials.yml/dispatches" -f ref=main

