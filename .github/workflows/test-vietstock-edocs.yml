name: Test Vietstock eDocuments Crawler

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/collect-vietstock-edocs.py"
      - ".github/workflows/test-vietstock-edocs.yml"
  workflow_dispatch:
    inputs:
      symbol:
        description: Stock ticker to test (ALL runs all configured tickers)
        required: true
        default: ALL
        type: string
      max_pages:
        description: Maximum public pages to inspect per ticker
        required: true
        default: "35"
        type: string

permissions:
  contents: write

concurrency:
  group: vietstock-edocs-test
  cancel-in-progress: false

jobs:
  test-edocs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r .github/scripts/requirements-report-worker.txt
      - name: Crawl and validate public reports for selected tickers
        env:
          REQUESTED_SYMBOL: ${{ inputs.symbol || 'ALL' }}
          EDOCS_MAX_PAGES: ${{ inputs.max_pages || '35' }}
          ALLOW_BROKER_PDF_ARCHIVE: "false"
        run: |
          set -euo pipefail
          if [ "$REQUESTED_SYMBOL" = "ALL" ]; then
            SYMBOLS="MBB ACB FPT SHB TCX HCM VND SHS NLG BSR TCB VHM"
          else
            SYMBOLS="$REQUESTED_SYMBOL"
          fi
          for symbol in $SYMBOLS; do
            echo "===== Testing ticker: $symbol ====="
            REPORT_TEST_SYMBOL="$symbol" python .github/scripts/collect-vietstock-edocs.py
          done
      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/analysis/analysis-reports.json data/analysis-reports.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Test Vietstock eDocuments discovery for requested tickers"
            git push
          fi
      - name: Upload catalog and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietstock-edocs-test-${{ inputs.symbol || 'ALL' }}
          path: |
            reports/analysis/analysis-reports.json
            data/analysis-reports.json
          if-no-files-found: warn
          retention-days: 14
