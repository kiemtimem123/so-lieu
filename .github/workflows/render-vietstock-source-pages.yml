name: Render Vietstock source PDF pages for visual audit
# Temporary visual audit target: VDS Q1/2026 consolidated HN notes pages 31-41, VietstockFinance doc 543855.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-vietstock-source-pages.yml"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker symbol"
        required: true
        default: "PLX"
      period:
        description: "Report period label"
        required: true
        default: "2025-Q1-CASH-BASIS"
      pdf_path:
        description: "Path to the PDF already archived in reports/raw"
        required: true
        default: "reports/raw/PLX/auto-plx-20261021/8ebe33f1a2757507.pdf"
      pages:
        description: "Comma-separated 1-based PDF pages, or all"
        required: true
        default: "2,3,4,5,9,10,14"
      dpi:
        description: "Render DPI"
        required: true
        default: "300"
      pdf_member:
        description: "Exact PDF filename inside ZIP; leave blank to auto-select the company-parent member"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout only the selected PDF from the archive
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ${{ github.event.inputs.pdf_path || 'reports/raw/PLX/auto-plx-20261021/8ebe33f1a2757507.pdf' }}
          sparse-checkout-cone-mode: false
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF rendering dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow

      - name: Render source pages and contact sheets
        env:
          TARGET_SYMBOL: ${{ github.event.inputs.symbol || 'PLX' }}
          TARGET_PERIOD: ${{ github.event.inputs.period || '2025-Q1-CASH-BASIS' }}
          PDF_PATH: ${{ github.event.inputs.pdf_path || 'reports/raw/VDS/auto-vds-20261021/2720dd850acfbd95.pdf' }}
          PAGE_LIST: ${{ github.event.inputs.pages || '2,3,4,5,9,10,14' }}
          RENDER_DPI: ${{ github.event.inputs.dpi || '300' }}
          PDF_MEMBER: ${{ github.event.inputs.pdf_member || '' }}
        run: |
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          import fitz
          from PIL import Image, ImageOps, ImageDraw

          symbol = os.environ["TARGET_SYMBOL"].strip().upper()
          period = os.environ["TARGET_PERIOD"].strip().upper()
          pdf_path = Path(os.environ["PDF_PATH"])
          if not pdf_path.is_file():
              raise SystemExit(f"Archived PDF not found: {pdf_path}")
          dpi = max(96, min(300, int(os.environ.get("RENDER_DPI", "160"))))
          if pdf_path.suffix.lower() == ".zip":
              with zipfile.ZipFile(pdf_path) as archive:
                  members = sorted(n for n in archive.namelist() if n.lower().endswith(".pdf"))
                  print("PDF members:", members)
                  requested_member = os.environ.get("PDF_MEMBER", "").strip()
                  if requested_member:
                      selected = [name for name in members if Path(name).name == requested_member]
                  else:
                      selected = [name for name in members if "Congtyme" in Path(name).name]
                  if len(selected) != 1:
                      raise SystemExit("Expected exactly one requested PDF member; requested=" + repr(requested_member) + "; selected=" + repr(selected) + "; ZIP members=" + repr(members))
                  print("Selected PDF member for visual review:", selected[0])
                  pdf_bytes = archive.read(selected[0])
              doc = fitz.open(stream=pdf_bytes, filetype="pdf")
          else:
              doc = fitz.open(pdf_path)
          raw_pages = os.environ.get("PAGE_LIST", "all").strip().lower()
          if raw_pages == "all":
              pages = list(range(1, len(doc) + 1))
          else:
              pages = sorted({int(x.strip()) for x in raw_pages.split(",") if x.strip()})
          if not pages or any(p < 1 or p > len(doc) for p in pages):
              raise SystemExit(f"Invalid page list for {len(doc)}-page PDF: {pages}")
          out = Path("source-review") / f"{symbol}-{period}"
          out.mkdir(parents=True, exist_ok=True)
          scale = dpi / 72
          rendered = []
          for pno in pages:
              page = doc[pno - 1]
              pix = page.get_pixmap(matrix=fitz.Matrix(scale, scale), alpha=False)
              image_path = out / f"{symbol}_{period}_page_{pno:02d}.png"
              pix.save(image_path)
              im = Image.open(image_path).convert("RGB")
              thumb = im.copy()
              thumb.thumbnail((1050, 1485))
              framed = ImageOps.expand(thumb, border=2, fill="black")
              rendered.append((pno, framed))
          # Keep contact sheets small enough to inspect at full resolution.
          for start in range(0, len(rendered), 2):
              group = rendered[start:start+2]
              max_w = max(im.width for _, im in group)
              max_h = max(im.height for _, im in group)
              sheet = Image.new("RGB", (max_w, max_h * len(group) + 70 * len(group)), "white")
              draw = ImageDraw.Draw(sheet)
              for i, (pno, im) in enumerate(group):
                  y = i * (max_h + 70)
                  draw.text((12, y + 8), f"{symbol} {period} — PDF page {pno}", fill="black")
                  sheet.paste(im, (0, y + 38))
              sheet.save(out / f"contact_{start+1:02d}_{group[-1][0]:02d}.jpg", quality=90)
          (out / "render_manifest.txt").write_text(
              f"symbol={symbol}\nperiod={period}\npdf_path={pdf_path}\npdf_pages={len(doc)}\n"
              f"dpi={dpi}\nrendered_pages={','.join(map(str, pages))}\n",
              encoding="utf-8"
          )
          print(f"Rendered {len(rendered)} of {len(doc)} pages at {dpi} DPI to {out}")
          PY

      - name: Upload rendered source pages
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: vietstock-source-review-${{ github.event.inputs.symbol || 'VDS' }}-${{ github.event.inputs.period || '2025-Q1-CASH-BASIS' }}
          path: source-review/
          if-no-files-found: error
          retention-days: 14

      - name: Record render artifact coordinates
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          SOURCE_PDF: ${{ github.event.inputs.pdf_path || 'reports/raw/PLX/auto-plx-20261021/8ebe33f1a2757507.pdf' }}
          TARGET_SYMBOL: ${{ github.event.inputs.symbol || 'VDS' }}
          TARGET_PERIOD: ${{ github.event.inputs.period || '2025-Q2' }}
          PDF_MEMBER: ${{ github.event.inputs.pdf_member || '' }}
        with:
          script: |
            const sourceDir = process.env.SOURCE_PDF.includes("/") ? process.env.SOURCE_PDF.slice(0, process.env.SOURCE_PDF.lastIndexOf("/")) : `reports/raw/${process.env.TARGET_SYMBOL}`;
            const path = `${sourceDir}/render-metadata-${process.env.TARGET_PERIOD}.json`;
            const payload = {
              symbol: process.env.TARGET_SYMBOL || 'IDC',
              period: process.env.TARGET_PERIOD,
              sourcePdf: process.env.SOURCE_PDF,
              sourceDocumentMember: process.env.PDF_MEMBER || null,
              workflowRunId: context.runId,
              artifactId: Number(process.env.ARTIFACT_ID),
              artifactName: `vietstock-source-review-${process.env.TARGET_SYMBOL}-${process.env.TARGET_PERIOD}`,
              sourceCommit: context.sha,
              recordedAt: new Date().toISOString()
            };
            const content = Buffer.from(JSON.stringify(payload, null, 2)).toString('base64');
            const write = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `Record ${process.env.TARGET_SYMBOL} ${process.env.TARGET_PERIOD} source render artifact`,
              content,
              branch: context.ref.replace('refs/heads/', '')
            };
            try {
              const existing = await github.rest.repos.getContent({
                owner: write.owner, repo: write.repo, path, ref: write.branch
              });
              if (Array.isArray(existing.data) || !existing.data.sha) throw new Error('Artifact metadata path is not a file');
              write.sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents(write);
