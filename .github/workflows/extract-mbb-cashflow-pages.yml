name: Extract MBB Cash-Flow Source Pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/extract-mbb-cashflow-pages.py"
      - ".github/workflows/extract-mbb-cashflow-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: so-lieu-mbb-cashflow-source-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout only MBB cash-flow sources and helper
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/financials-MBB.json
            /scripts/extract-mbb-cashflow-pages.py
            /reports/raw/MBB/vietstock-mbb-20261019/
            /reports/raw/MBB/manual-mbb-smoke-20261018/
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-vie
          python -m pip install --upgrade pip
          pip install pypdf
      - name: Targeted OCR of MBB PDF pages 7-8 at 300dpi
        run: python scripts/extract-mbb-cashflow-pages.py
      - name: Commit MBB source evidence sidecars
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/raw/MBB/
          if git diff --cached --quiet; then
            echo "No sidecar changes to commit."
            exit 0
          fi
          git commit -m "data: add 300dpi MBB cash-flow source-page evidence"
          git push
