name: One-time TCX stale archive queue integration test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-tcx-retry-smoke.yml"

permissions:
  actions: write

jobs:
  dispatch-selected-ticker:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the real collector for TCX
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/collect-financial-reports.yml/dispatches" \
            -f ref=main \
            -f "inputs[symbol]=TCX" \
            -f "inputs[max_downloads_per_job]=2"
