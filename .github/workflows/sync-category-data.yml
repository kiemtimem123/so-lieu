name: Sync Core Economic Indicators

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync-category-data.cjs'
      - '.github/workflows/sync-category-data.yml'
  schedule:
    - cron: "30 23 * * 0"

concurrency:
  group: dlkt-category-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-categories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Fetch category series
        shell: bash
        env:
          DLKT_API_KEY: ${{ secrets.DLKT_API_KEY }}
        run: |
          set -eu
          if [ -z "${DLKT_API_KEY:-}" ]; then
            echo "ERROR: Missing DLKT_API_KEY secret."
            exit 1
          fi
          STATUS_1="$(curl --silent --show-error --max-time 30 --get \
            --header "Authorization: Bearer ${DLKT_API_KEY}" \
            --data-urlencode "ids=22675,30221,32542,31248,34763,22659,22905,18709,22603,22606,24655,22865,22613,36762,33392,33408,33265,29926,34758,29406" \
            --data-urlencode "from=2022-01-01" \
            --data-urlencode "limit=50" \
            --output category-response-1.json --write-out "%{http_code}" \
            "https://api.dulieukinhte.com/v1/series/observations")"
          echo "Category API batch 1 HTTP status: ${STATUS_1}"
          case "${STATUS_1}" in 2*) ;; *) cat category-response-1.json; exit 1 ;; esac

          sleep 8
          STATUS_2="$(curl --silent --show-error --max-time 30 --get \
            --header "Authorization: Bearer ${DLKT_API_KEY}" \
            --data-urlencode "ids=66457,29380,18699,22870,27690,53631,30225,30139" \
            --data-urlencode "from=2022-01-01" \
            --data-urlencode "limit=50" \
            --output category-response-2.json --write-out "%{http_code}" \
            "https://api.dulieukinhte.com/v1/series/observations")"
          echo "Category API batch 2 HTTP status: ${STATUS_2}"
          case "${STATUS_2}" in 2*) ;; *) cat category-response-2.json; exit 1 ;; esac

          sleep 8
          STATUS_3="$(curl --silent --show-error --max-time 30 --get \
            --header "Authorization: Bearer ${DLKT_API_KEY}" \
            --data-urlencode "ids=33445,33446,33447,33340" \
            --data-urlencode "from=2026-01-01" \
            --data-urlencode "limit=50" \
            --output category-response-3.json --write-out "%{http_code}" \
            "https://api.dulieukinhte.com/v1/series/observations")"
          echo "Category API batch 3 HTTP status: ${STATUS_3}"
          case "${STATUS_3}" in 2*) ;; *) cat category-response-3.json; exit 1 ;; esac

          sleep 8
          STATUS_4="$(curl --silent --show-error --max-time 30 --get \
            --header "Authorization: Bearer ${DLKT_API_KEY}" \
            --data-urlencode "ids=37096,37105,37106,30768,30769,30802" \
            --data-urlencode "from=2026-09-01" \
            --data-urlencode "limit=50" \
            --output category-response-4.json --write-out "%{http_code}" \
            "https://api.dulieukinhte.com/v1/series/observations")"
          echo "Category API batch 4 HTTP status: ${STATUS_4}"
          case "${STATUS_4}" in 2*) ;; *) cat category-response-4.json; exit 1 ;; esac

      - name: Validate and save category snapshot
        run: node .github/scripts/sync-category-data.cjs

      - name: Commit category snapshot
        shell: bash
        run: |
          set -eu
          rm -f category-response-1.json category-response-2.json category-response-3.json category-response-4.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/category-data.json /tmp/category-data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/category-data.json data/category-data.json
          git add data/category-data.json
          if git diff --cached --quiet; then
            echo "No category data changes."
          else
            git commit -m "Update macroeconomic and balance of payments data"
            git push origin HEAD:main
          fi
