name: Validate Site and Data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /.github/workflows/sync-category-data.yml
            /.github/workflows/sync-omo-latest.yml
            /api/analysis-reports.php
            /assets/app.js
            /config/
            /data/
            /index.html
            /scripts/
            /tests/

      - name: Setup PHP for API syntax check
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint isolated report database API
        run: php -l api/analysis-reports.php

      - name: Setup Python for report worker syntax check
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check report worker syntax
        run: python -m py_compile .github/scripts/collect-financial-reports.py scripts/sync-vietstock-financials.py scripts/enrich-financial-categories.py

      - name: Test cash-flow bridge reconciliation
        run: python tests/test_cashflow_bridge.py
      - name: Test financial table source allow-list
        run: node tests/test_financial_table_allowlist.mjs

      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check .github/scripts/sync-category-data.cjs
          node --check .github/scripts/sync-omo-latest.cjs
          node --check .github/scripts/sync-market-prices.cjs
          node --check .github/scripts/sync-currency-rates.cjs
          node --check .github/scripts/sync-financial-rates.cjs
          node --check .github/scripts/validate-report-queue.cjs

      - name: Validate JSON snapshots
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const files = [
            'data/category-data.json',
            'data/omo-latest.json',
            'data/market-prices.json',
            'data/currency-rates.json',
            'data/financial-rates.json',
            'data/policy-rates.json',
            'data/credit-growth.json',
          ];
          JSON.parse(fs.readFileSync('config/securities.json', 'utf8'));
          JSON.parse(fs.readFileSync('config/report-queue.json', 'utf8'));
          for (const file of files) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!value || typeof value !== 'object') throw new Error('Invalid JSON root: ' + file);
            console.log('JSON OK:', file);
          }
          const securityConfig = JSON.parse(fs.readFileSync('config/securities.json', 'utf8'));
          const configuredSymbols = [...new Set((securityConfig.securities || [])
            .filter(item => item && item.enabled !== false && item.symbol)
            .map(item => String(item.symbol).trim().toUpperCase()))];
          for (const symbol of configuredSymbols) {
            const file = 'data/financials-' + symbol + '.json';
            if (!fs.existsSync(file)) {
              console.warn('Financial snapshot not bootstrapped yet:', file);
              continue;
            }
            const snapshot = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (snapshot.symbol !== symbol || !Array.isArray(snapshot.items)) throw new Error('Invalid financial snapshot schema: ' + file);
            for (const row of snapshot.items) {
              if (!/^[0-9]{4}-Q[1-4]$/.test(String(row.period || ''))) throw new Error('Invalid quarter period in ' + file);
              const sourceUrl = String(row.source_url || '');
              if (!(sourceUrl.startsWith('https://') || sourceUrl.startsWith('http://'))) throw new Error('Financial row missing source URL in ' + file);
            }
            console.log('Financial schema OK:', file, 'rows=' + snapshot.items.length);
          }
          NODE

      - name: Check OMO wiring and source definitions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const app = fs.readFileSync('assets/app.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const script = fs.readFileSync('.github/scripts/sync-category-data.cjs', 'utf8');
          const workflow = fs.readFileSync('.github/workflows/sync-category-data.yml', 'utf8');
          const omoScript = fs.readFileSync('.github/scripts/sync-omo-latest.cjs', 'utf8');
          const omoWorkflow = fs.readFileSync('.github/workflows/sync-omo-latest.yml', 'utf8');
          const checks = [
            [app.includes('async function loadOmoData()') && app.includes('loadOmoData();'), 'OMO loader and initialization'],
            [html.includes('id="omoDataContent"') && html.includes('id="omoDataUpdated"'), 'OMO panel targets'],
            [script.includes('id: 27690') && script.includes('id: 53631'), 'OMO series definitions'],
            [workflow.includes('27690,53631'), 'OMO API IDs in legacy sync batch'],
            [(app.includes("fetchDataFile('omo-latest.json'") || app.includes("fetch('data/omo-latest.json'")) && app.includes('Snapshot OMO riêng chưa có'), 'OMO UI uses fresh snapshot only'],
            [omoScript.includes('readLatest') && omoScript.includes('omo-latest.json'), 'OMO parser and output snapshot'],
            [omoWorkflow.includes('sync-omo-latest.cjs') && omoWorkflow.includes('curl --fail'), 'OMO automated source sync workflow'],
            [app.includes('function setupFinancials()') && app.includes('stockProfitChart') && app.includes('stockBalanceChart') && app.includes('stockRatiosChart') && app.includes('stockCompareChart'), 'Financial dashboard chart renderers'],
            [html.includes('id="stockProfitChart"') && html.includes('id="stockBalanceChart"') && html.includes('id="stockRatiosChart"') && html.includes('id="stockCompareChart"') && /(report-db-5|financial-line-items-[0-9]+)/.test(html), 'Financial dashboard chart panels and cache version']
          ];
          for (const [ok, label] of checks) {
            if (!ok) throw new Error('Validation failed: ' + label);
            console.log('OK:', label);
          }
          NODE
