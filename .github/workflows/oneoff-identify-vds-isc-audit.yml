name: One-off identify VDS ISC audited PDF member

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-identify-vds-isc-audit.yml"

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact annual archive only
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            reports/raw/VDS/auto-vds-20261021/bd7db8914d33e414.pdf
          sparse-checkout-cone-mode: false
          lfs: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Render exact VDS Q3 2025 B04 page
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import fitz
          from PIL import Image, ImageOps, ImageDraw
          archive=Path("reports/raw/VDS/auto-vds-20261021/bd7db8914d33e414.pdf")
          data=archive.read_bytes()
          doc=fitz.open(archive)
          out=Path("source-review/VDS-Q3-2025-B04")
          out.mkdir(parents=True,exist_ok=True)
          pages=[]
          for pno in [17]:
              if pno >= len(doc): raise SystemExit(f"Missing requested PDF page {pno+1}")
              page=doc[pno]
              pix=page.get_pixmap(matrix=fitz.Matrix(2,2),alpha=False)
              im=Image.frombytes("RGB",[pix.width,pix.height],pix.samples)
              fn=out/f"page-{pno+1:02d}.jpg"
              im.save(fn,"JPEG",quality=88,optimize=True)
              thumb=im.copy(); thumb.thumbnail((620,880))
              pages.append((pno+1,ImageOps.expand(thumb,border=2,fill="black")))
          cols=3; cellw=max(im.width for _,im in pages); cellh=max(im.height for _,im in pages)+35
          sheet=Image.new("RGB",(cols*cellw,1*cellh),"white")
          draw=ImageDraw.Draw(sheet)
          for i,(n,im) in enumerate(pages):
              x=(i%cols)*cellw; y=(i//cols)*cellh
              draw.text((x+6,y+5),f"PDF page {n}",fill="black")
              sheet.paste(im,(x,y+30))
          sheet.save(out/"contact-18.jpg","JPEG",quality=90,optimize=True)
          (out/"manifest.json").write_text(json.dumps({
            "archive":str(archive),"selectedMember":archive.name,
            "pdfSha256":hashlib.sha256(data).hexdigest(),
            "pdfPageCount":len(doc),"renderedPages":[18]
          },ensure_ascii=False,indent=2),encoding="utf-8")
          print("source",archive.name,"pages",len(doc),"sha256",hashlib.sha256(data).hexdigest())
          PY
      - name: Upload identification render
        uses: actions/upload-artifact@v4
        with:
          name: vds-q3-2025-b04-review
          path: source-review/VDS-ISC-FY2025/
          if-no-files-found: error
          retention-days: 2
