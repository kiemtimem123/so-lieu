name: Validate quarterly financial data

on:
  push:
    paths:
      - "data/financials-*.json"
      - "scripts/validate-financials.mjs"
      - ".github/scripts/collect-financial-reports.py"
      - ".github/scripts/ocr-stored-reports.py"
      - ".github/scripts/validate-report-queue.cjs"
      - "config/report-queue.json"
      - "config/source-registry.json"
      - ".github/workflows/collect-financial-reports.yml"
      - ".github/workflows/ocr-financial-reports.yml"
      - "scripts/enrich-financial-categories.py"
      - "scripts/sync-vietstock-financials.py"
      - "config/securities.json"
      - "reports/raw/**/*.extracted.json"
      - ".github/workflows/validate-financials.yml"
  pull_request:
    paths:
      - "data/financials-*.json"
      - "scripts/validate-financials.mjs"
      - ".github/scripts/collect-financial-reports.py"
      - ".github/scripts/ocr-stored-reports.py"
      - ".github/scripts/validate-report-queue.cjs"
      - "config/report-queue.json"
      - "config/source-registry.json"
      - ".github/workflows/collect-financial-reports.yml"
      - ".github/workflows/ocr-financial-reports.yml"
      - "scripts/enrich-financial-categories.py"
      - "reports/raw/**/*.extracted.json"
      - ".github/workflows/validate-financials.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/financials-*.json
            /scripts/enrich-financial-categories.py
            /scripts/sync-vietstock-financials.py
            /config/securities.json
            /scripts/validate-financials.mjs
            /.github/scripts/collect-financial-reports.py
            /.github/scripts/ocr-stored-reports.py
            /.github/scripts/validate-report-queue.cjs
            /config/report-queue.json
            /config/source-registry.json
            /.github/workflows/collect-financial-reports.yml
            /.github/workflows/ocr-financial-reports.yml
            /reports/raw/**/*.extracted.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Vietstock sync worker syntax
        run: python -m py_compile scripts/sync-vietstock-financials.py
      - name: Check financial enrichment script syntax
        run: python -m py_compile scripts/enrich-financial-categories.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check report collector syntax
        run: python -m py_compile .github/scripts/collect-financial-reports.py
      - name: Check archived-report OCR syntax
        run: python -m py_compile .github/scripts/ocr-stored-reports.py
      - name: Validate report queue
        run: node .github/scripts/validate-report-queue.cjs
      - name: Validate quarterly financial snapshots
        run: node scripts/validate-financials.mjs
