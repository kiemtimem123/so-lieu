name: Sync quarterly BCTC from VietstockFinance

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-vietstock-financials.py"
  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:
    inputs:
      symbol:
        description: "Mã cổ phiếu cần đồng bộ; để trống để tiếp tục mã đầu tiên còn thiếu/chờ xử lý"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  # Isolate catalog sync from OCR/collector dispatches; commits use safe fetch/rebase/push retries.
  group: so-lieu-vietstock-sync-v1
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/securities.json
            /data/financials-*.json
            /scripts/sync-vietstock-financials.py
            /scripts/validate-financials.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-vie poppler-utils

      - name: Install document processing dependencies
        run: python -m pip install --upgrade requests pypdf pdf2image pytesseract Pillow

      - name: Check VietstockFinance catalog and append new quarters
        env:
          PYTHONUTF8: "1"
          FINANCIAL_SYNC_SYMBOL: ${{ github.event.inputs.symbol || '' }}
          FINANCIAL_SYNC_BOOTSTRAP_ONLY: "1"
          # A deliberate script push is the operator's retry signal; scheduled runs still honor the cooldown.
          FINANCIAL_SYNC_FORCE_RETRY: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python scripts/sync-vietstock-financials.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate financial snapshots
        run: node scripts/validate-financials.mjs

      - name: Commit snapshot changes (if any)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials-*.json
          if git diff --cached --quiet; then
            echo "No new quarters or successful pending extractions; repository is unchanged."
            exit 0
          fi

          git commit -m "Auto-sync quarterly BCTC from VietstockFinance"
          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "::warning::Concurrent data update; recompute only from the latest committed snapshots before retrying."
              git rebase --abort || true
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              python scripts/sync-vietstock-financials.py
              node scripts/validate-financials.mjs
              git add data/financials-*.json
              if git diff --cached --quiet; then
                echo "No remaining snapshot changes after recomputing from latest main."
                pushed=true
                break
              fi
              git commit -m "Reconcile one-ticker BCTC snapshot after concurrent update"
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done

          if [ "${pushed}" != "true" ]; then
            echo "::error::Could not push financial snapshots after five safe push attempts."
            exit 1
          fi

  trigger-ocr:
    needs: sync
    if: ${{ needs.sync.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Start the next one-report OCR/enrichment run after the snapshot sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ocr-financial-reports.yml/dispatches" -f ref=main
