
name: Sync Market Prices V2

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch market data
        shell: bash
        env:
          DLKT_API_KEY: ${{ secrets.DLKT_API_KEY }}
        run: |
          set -eu

          if [ -z "${DLKT_API_KEY:-}" ]; then
            echo "ERROR: Missing DLKT_API_KEY secret"
            exit 1
          fi

          FROM_DATE="$(date -u -d '30 days ago' +%F)"

          STATUS=$(curl -sS --max-time 30 -G \
            -H "Authorization: Bearer ${DLKT_API_KEY}" \
            --data-urlencode "ids=37826,37827,37694,37828,37695" \
            --data-urlencode "from=${FROM_DATE}" \
            --data-urlencode "limit=500" \
            -o response.json \
            -w "%{http_code}" \
            "https://api.dulieukinhte.com/v1/series/observations")

          echo "API HTTP status: ${STATUS}"

          case "$STATUS" in
            2*)
              ;;
            *)
              echo "ERROR: API request failed. Response:"
              cat response.json
              exit 1
              ;;
          esac

          if ! jq -e 'type == "object" and has("data") and (has("error") | not)' response.json > /dev/null; then
            echo "ERROR: API response is invalid or contains an error."
            jq -r '.error.message // .message // "Unknown API response"' response.json || true
            exit 1
          fi

      - name: Build market prices JSON
        shell: bash
        run: |
          set -eu

          mkdir -p data

          FETCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -e --arg fetchedAt "$FETCHED_AT" '
            {
              "37826": "WTI",
              "37827": "Brent",
              "37694": "Xăng thường tại Mỹ",
              "37828": "Dầu diesel tại Mỹ",
              "37695": "Khí tự nhiên Henry Hub"
            } as $labels
            |
            [37826, 37827, 37694, 37828, 37695] as $ids
            |
            . as $response
            |
            [
              $ids[] as $id
              |
              (
                ($response.data // [])
                | map(select((.id | tostring) == ($id | tostring)))
                | first
              ) as $series
              |
              if $series == null then
                error("Missing series ID " + ($id | tostring))
              elif ($series.skipped // false) then
                error("Series skipped: " + ($id | tostring))
              elif (($series.observations // []) | length) == 0 then
                error("No observations for series " + ($id | tostring))
              else
                (
                  $series.observations
                  | sort_by(.date // "")
                  | last
                ) as $latest
                |
                if ($latest.value == null or $latest.date == null) then
                  error("Missing value or date for series " + ($id | tostring))
                else
                  {
                    "id": $id,
                    "name": $labels[($id | tostring)],
                    "value": $latest.value,
                    "unit": $series.unit,
                    "date": $latest.date
                  }
                end
              end
            ] as $marketData
            |
            {
              "source": "DulieuKinhte API",
              "fetchedAt": $fetchedAt,
              "data": $marketData
            }
          ' response.json > data/market-prices.json.tmp

          mv data/market-prices.json.tmp data/market-prices.json

          echo "Market prices JSON created successfully."
          jq -r '.data[] | [.name, .value, (.unit // "unknown"), .date] | @tsv' data/market-prices.json

      - name: Commit updated data
        shell: bash
        run: |
          set -eu

          rm -f response.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market-prices.json

          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Update market prices data"
            git push
          fi

