
name: Inspect DulieuKinhte dataset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List series in dataset 458
        env:
          DLKT_API_KEY: ${{ secrets.DLKT_API_KEY }}
        run: |
          set -eu

          curl --fail --silent --show-error \
            --max-time 20 \
            --header "Authorization: Bearer ${DLKT_API_KEY}" \
            "https://api.dulieukinhte.com/v1/datasets/458" \
            --output dataset.json

          python - <<'PY'
          import json

          with open("dataset.json", encoding="utf-8") as f:
              result = json.load(f)

          if "error" in result:
              print("API error:", result["error"].get("code", "unknown"))
              raise SystemExit(1)

          data = result.get("data", {})
          print("Dataset:", data.get("name"))
          print("Frequency:", data.get("frequency"))
          print("Unit:", data.get("unit"))
          print("Series count:", data.get("seriesCount"))

          series = data.get("series", [])
          if not series:
              print("No series returned. Inspect the API response structure.")
          else:
              for s in series:
                  print(
                      "ID:", s.get("id"),
                      "| Name:", s.get("name"),
                      "| Parent:", s.get("parentId"),
                      "| Level:", s.get("level")
                  )
          PY
