
name: Inspect DulieuKinhte dataset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Get dataset 458 metadata and child series
        env:
          DLKT_API_KEY: ${{ secrets.DLKT_API_KEY }}
        run: |
          set -eu

          curl --fail --silent --show-error \
            --max-time 20 \
            --header "Authorization: Bearer ${DLKT_API_KEY}" \
            "https://api.dulieukinhte.com/v1/datasets/458" \
            --output dataset.json

          python - <<'PY'
          import json

          with open("dataset.json", encoding="utf-8") as f:
              result = json.load(f)

          if "error" in result:
              print("API error:", result["error"].get("code", "unknown"))
              raise SystemExit(1)

          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

