name: Collect Financial Reports
# Resume the active ticker while its missing quarterly report remains unresolved.
# Retry DPG Q2 2025 after reopening the full-report extraction dependency.

on:
  push:
    branches: [main]
    paths:
      - "config/report-queue.json"
      - "config/securities.json"
      - ".github/scripts/collect-financial-reports.py"
      - ".github/workflows/collect-financial-reports.yml"
  workflow_dispatch:
    inputs:
      symbol:
        description: Restrict this collector run to one stock ticker; blank selects the first incomplete ticker
        required: false
        default: ""
      max_downloads_per_job:
        description: Maximum reports to download for the selected ticker (capped at two)
        required: false
        default: "2"
      max_jobs_per_run:
        description: Maximum securities processed in one run (fixed to one ticker)
        required: false
        default: "1"
      run_supplementary_crawlers:
        description: Run slower supplementary crawlers
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 1 * * *'
    - cron: '5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  # Keep the single-ticker archive queue advancing even when OCR launches a new run.
  group: so-lieu-report-collector-v1
  cancel-in-progress: false

jobs:
  select-ticker:
    runs-on: ubuntu-24.04
    outputs:
      symbol: ${{ steps.pick.outputs.symbol }}
    steps:
      - name: Checkout ticker snapshots and checkpoint only
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/securities.json
            /data/financials-*.json
            /reports/processing-checkpoint.json
      - name: Select exactly one resumable ticker
        id: pick
        env:
          REQUESTED_SYMBOL: ${{ github.event.inputs.symbol || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return None

          config = load("config/securities.json") or {}
          securities = [
              item for item in config.get("securities", [])
              if isinstance(item, dict)
              and item.get("enabled") is not False
              and re.fullmatch(r"[A-Z0-9]{1,12}", str(item.get("symbol") or "").strip().upper())
          ]
          symbols = [str(item.get("symbol") or "").strip().upper() for item in securities]
          requested = os.environ.get("REQUESTED_SYMBOL", "").strip().upper()
          selected = ""
          reason = "all enabled tickers have no automated collection gaps"

          def snapshot_for(symbol):
              return load(Path("data") / f"financials-{symbol}.json")

          def terminal_manual(item):
              if not isinstance(item, dict) or item.get("verification_status") != "manual_review_required_pending_extraction":
                  return False
              validation = item.get("source_validation")
              if not isinstance(validation, dict):
                  validation = {}
              try:
                  attempts = int(validation.get("extraction_attempt_count") or 0)
              except (TypeError, ValueError):
                  attempts = 0
              try:
                  core_attempts = int(item.get("core_financial_extraction_attempt_count") or 0)
              except (TypeError, ValueError):
                  core_attempts = 0
              return validation.get("automatic_extraction_exhausted") is True or attempts >= 3 or core_attempts >= 3

          def needs_collection(symbol, snapshot):
              if snapshot is None:
                  return True
              # Inspect item-level unresolved full-report dependencies even when bootstrap is complete.
              items = snapshot.get("items") or []
              if not items:
                  try:
                      attempts = int(snapshot.get("bootstrap_attempt_count") or 0)
                  except (TypeError, ValueError):
                      attempts = 0
                  terminal_empty = (
                      attempts >= 3
                      and snapshot.get("sync_status") in {
                          "fetch_failed",
                          "no_quarterly_consolidated_records_returned",
                          "needs_manual_review_no_quarterly_data",
                      }
                  )
                  return not terminal_empty
              # Do not let a known missing full report disappear from the collection queue
              # merely because OCR has reached its retry limit on a shorter correction PDF.
              balance_sheet_pending = any(
                  isinstance(item, dict)
                  and item.get("balance_sheet_extraction_status") == "pending_full_report_archive_and_extraction"
                  and str(item.get("balance_sheet_source_url") or "").startswith("https://")
                  and not (
                      isinstance(item.get("source_validation"), dict)
                      and item["source_validation"].get("full_report_present_in_archive") is True
                  )
                  for item in items
              )
              core_pending = any(
                  isinstance(item, dict)
                  and item.get("verification_status") in {
                      "auto_pending_extraction",
                      "manual_review_required_pending_extraction",
                  }
                  and not terminal_manual(item)
                  for item in items
              )
              detail_review_statuses = {
                  "manual_review_required",
                  "manual_review_required_pending_extraction",
                  "no_detail_fields_matched_pending_manual_review",
                  "auto_extracted_pending_visual_review",
              }
              details_pending = any(
                  isinstance(item, dict)
                  and re.fullmatch(r"20\d{2}-Q[1-4]", str(item.get("period") or ""))
                  and item.get("total_assets") is not None
                  and item.get("net_profit") is not None
                  and not item.get("financial_line_items_status")
                  for item in items
              )
              stale_details = any(
                  isinstance(item, dict)
                  and item.get("financial_line_items_status")
                  and item.get("financial_line_items_status") not in detail_review_statuses
                  and item.get("financial_line_items_schema_version") != "2026-10-22-bank-statement-qc-v4"
                  for item in items
              )
              return balance_sheet_pending or core_pending or details_pending or stale_details or snapshot.get("bootstrap_status") not in {"complete", "complete_needs_manual_review"}

          if requested:
              if requested not in symbols:
                  raise SystemExit(f"Requested ticker is not enabled: {requested}")
              selected = requested
              reason = "explicit workflow input"
          else:
              checkpoint = load("reports/processing-checkpoint.json") or {}
              active = str(checkpoint.get("activeSymbol") or "").strip().upper()
              if active in symbols and needs_collection(active, snapshot_for(active)):
                  selected = active
                  reason = "resume from saved checkpoint"
              else:
                  for symbol in symbols:
                      if needs_collection(symbol, snapshot_for(symbol)):
                          selected = symbol
                          reason = "first incomplete ticker in registry order"
                          break

          print(json.dumps({
              "symbol": selected or None,
              "reason": reason,
              "mode": "one ticker only",
          }, ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"symbol={selected}\n")
              handle.write(f"reason={reason}\n")
          PY

  collect:
    needs: select-ticker
    if: ${{ needs['select-ticker'].result == 'success' && needs['select-ticker'].outputs.symbol != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout only the selected ticker's reports and shared indexes
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/collect-financial-reports.py
            /.github/scripts/collect-vietstock-edocs.py
            /.github/scripts/collect-analysis-reports.py
            /.github/scripts/validate-report-queue.cjs
            /.github/scripts/requirements-report-worker.txt
            /config/report-queue.json
            /config/securities.json
            /config/source-registry.json
            /data/analysis-reports.json
            /data/financials-*.json
            /reports/worker-last-run.json
            /reports/raw/${{ needs['select-ticker'].outputs.symbol }}/**
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile collector before run
        run: python -m py_compile .github/scripts/collect-financial-reports.py
      - name: Install collector dependencies
        run: pip install -r .github/scripts/requirements-report-worker.txt
      - name: Validate queue and registry before run
        run: node .github/scripts/validate-report-queue.cjs
      - name: Run report discovery, download and extraction worker
        env:
          REPORT_COLLECT_SYMBOL: ${{ needs['select-ticker'].outputs.symbol }}
          MAX_DOWNLOADS_PER_JOB: ${{ github.event.inputs.max_downloads_per_job || '2' }}
          MAX_JOBS_PER_RUN: "1"
        run: python .github/scripts/collect-financial-reports.py
      - name: Install OCR tools for image-only financial statements
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_supplementary_crawlers == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-vie
      - name: OCR statement pages when source PDFs have no text layer (optional; separate workflow runs after archive commit)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_supplementary_crawlers == 'true' }}
        env:
          REPORT_OCR_MAX_PAGES: '12'
          REPORT_OCR_DPI: '180'
        run: python .github/scripts/ocr-stored-reports.py
      - name: Crawl Vietstock eDocuments directly and validate MBB PDF (optional, slower)
        if: ${{ github.event.inputs.run_supplementary_crawlers == 'true' }}
        env:
          REPORT_TEST_SYMBOL: MBB
          EDOCS_MAX_PAGES: '35'
          ALLOW_BROKER_PDF_ARCHIVE: 'false'
        run: python .github/scripts/collect-vietstock-edocs.py
      - name: Collect brokerage analysis and forecast report catalog (optional, slower)
        if: ${{ github.event.inputs.run_supplementary_crawlers == 'true' }}
        run: python .github/scripts/collect-analysis-reports.py
      - name: Validate queue after run
        run: node .github/scripts/validate-report-queue.cjs
      - name: Commit report archive and queue log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/report-queue.json reports/ data/analysis-reports.json data/financials-*.json
          if git diff --cached --quiet; then
            echo "No report queue/archive changes to commit."
            exit 0
          fi

          git commit -m "Collect public financial report candidates"
          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Safe collector push attempt ${attempt}/5"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "::warning::Remote advanced between fetch and push; will retry."
            else
              echo "::warning::Concurrent report/snapshot update detected; rerunning the single-ticker collector from latest main."
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              node .github/scripts/validate-report-queue.cjs
              python .github/scripts/collect-financial-reports.py
              node .github/scripts/validate-report-queue.cjs
              git add config/report-queue.json reports/ data/analysis-reports.json data/financials-*.json
              if git diff --cached --quiet; then
                echo "No remaining changes after recomputing on latest main."
                pushed=true
                break
              fi
              git commit -m "Reconcile single-ticker report archive after concurrent update"
            fi
            sleep $((attempt * 2))
          done

          if [ "${pushed}" != "true" ]; then
            echo "::error::Collector could not safely push its current single-ticker batch after five attempts."
            exit 1
          fi
      - name: Upload worker summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: financial-report-worker-summary
          path: reports/worker-last-run.json
          if-no-files-found: ignore
          retention-days: 30

  advance-collector:
    needs: collect
    if: ${{ needs.collect.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      symbol: ${{ steps.continuation.outputs.symbol }}
      should_continue: ${{ steps.continuation.outputs.should_continue }}
    steps:
      - name: Read the committed worker checkpoint
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/report-queue.json
            /config/securities.json
            /reports/worker-last-run.json
      - name: Continue only the same ticker when the previous batch made progress
        id: continuation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def read(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return {}

          summary = read("reports/worker-last-run.json")
          queue = read("config/report-queue.json")
          registry = read("config/securities.json")
          valid_symbols = {
              str(item.get("symbol") or "").strip().upper()
              for item in registry.get("securities", [])
              if isinstance(item, dict) and item.get("enabled") is not False and item.get("symbol")
          }
          symbol = str(summary.get("active_symbol") or "").strip().upper()
          job_id = summary.get("active_job_id")
          job = next(
              (
                  item for item in queue.get("jobs", [])
                  if isinstance(item, dict)
                  and item.get("id") == job_id
                  and str(item.get("symbol") or "").strip().upper() == symbol
              ),
              None,
          )
          should_continue = bool(
              symbol in valid_symbols
              and summary.get("continuation_needed") is True
              and int(summary.get("jobs_processed") or 0) == 1
              and job
              and job.get("status") == "queued"
              and job.get("resumeDownload") is True
              and len(job.get("sourceCandidates") or []) > 0
          )
          print(json.dumps({
              "active_symbol": symbol or None,
              "job_id": job_id,
              "jobs_processed": summary.get("jobs_processed"),
              "continuation_needed": summary.get("continuation_needed"),
              "queue_status": job.get("status") if job else None,
              "remaining_candidates": len(job.get("sourceCandidates") or []) if job else 0,
              "should_continue": should_continue,
          }, ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("symbol=" + (symbol if should_continue else "") + chr(10))
              handle.write("should_continue=" + ("true" if should_continue else "false") + chr(10))
          PY
      - name: Dispatch the next two-document batch for the same ticker
        if: ${{ steps.continuation.outputs.should_continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Continue only ticker ${{ steps.continuation.outputs.symbol }} from its committed queue checkpoint."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/collect-financial-reports.yml/dispatches" -f ref=main -f "inputs[symbol]=${{ steps.continuation.outputs.symbol }}" -f "inputs[max_downloads_per_job]=2"

  trigger-ocr:
    needs: [collect, advance-collector]
    if: ${{ needs.collect.result == 'success' && needs['advance-collector'].result == 'success' && needs['advance-collector'].outputs.should_continue != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Start the next one-report OCR/enrichment run after the collector commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ocr-financial-reports.yml/dispatches" -f ref=main
