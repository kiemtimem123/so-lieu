name: Collect Financial Reports

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/collect-financial-reports.py"
      - ".github/workflows/collect-financial-reports.yml"
      - "config/report-queue.json"
      - "config/securities.json"
  workflow_dispatch:
    inputs:
      max_downloads_per_job:
        description: Maximum reports to download for each queued security (capped at two)
        required: false
        default: "2"
      max_jobs_per_run:
        description: Maximum securities processed in one run (fixed to one ticker)
        required: false
        default: "1"
      run_supplementary_crawlers:
        description: Run slower supplementary crawlers
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 1 * * *'
    - cron: '5 * * * *'

permissions:
  contents: write

concurrency:
  group: so-lieu-financial-data-writes-v2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile collector before run
        run: python -m py_compile .github/scripts/collect-financial-reports.py
      - name: Install collector dependencies
        run: pip install -r .github/scripts/requirements-report-worker.txt
      - name: Validate queue and registry before run
        run: node .github/scripts/validate-report-queue.cjs
      - name: Run report discovery, download and extraction worker
        env:
          MAX_DOWNLOADS_PER_JOB: ${{ github.event.inputs.max_downloads_per_job || '2' }}
          MAX_JOBS_PER_RUN: "1"
        run: python .github/scripts/collect-financial-reports.py
      - name: Install OCR tools for image-only financial statements
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_supplementary_crawlers == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-vie
      - name: OCR statement pages when source PDFs have no text layer (optional; separate workflow runs after archive commit)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_supplementary_crawlers == 'true' }}
        env:
          REPORT_OCR_MAX_PAGES: '12'
          REPORT_OCR_DPI: '180'
        run: python .github/scripts/ocr-stored-reports.py
      - name: Crawl Vietstock eDocuments directly and validate MBB PDF (optional, slower)
        if: ${{ github.event.inputs.run_supplementary_crawlers == 'true' }}
        env:
          REPORT_TEST_SYMBOL: MBB
          EDOCS_MAX_PAGES: '35'
          ALLOW_BROKER_PDF_ARCHIVE: 'false'
        run: python .github/scripts/collect-vietstock-edocs.py
      - name: Collect brokerage analysis and forecast report catalog (optional, slower)
        if: ${{ github.event.inputs.run_supplementary_crawlers == 'true' }}
        run: python .github/scripts/collect-analysis-reports.py
      - name: Validate queue after run
        run: node .github/scripts/validate-report-queue.cjs
      - name: Commit report archive and queue log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/report-queue.json reports/ data/analysis-reports.json data/financials-*.json
          if git diff --cached --quiet; then
            echo "No report queue/archive changes to commit."
            exit 0
          fi

          git commit -m "Collect public financial report candidates"
          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Safe collector push attempt ${attempt}/5"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "::warning::Remote advanced between fetch and push; will retry."
            else
              echo "::warning::Concurrent report/snapshot update detected; rerunning the single-ticker collector from latest main."
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              node .github/scripts/validate-report-queue.cjs
              python .github/scripts/collect-financial-reports.py
              node .github/scripts/validate-report-queue.cjs
              git add config/report-queue.json reports/ data/analysis-reports.json data/financials-*.json
              if git diff --cached --quiet; then
                echo "No remaining changes after recomputing on latest main."
                pushed=true
                break
              fi
              git commit -m "Reconcile single-ticker report archive after concurrent update"
            fi
            sleep $((attempt * 2))
          done

          if [ "${pushed}" != "true" ]; then
            echo "::error::Collector could not safely push its current single-ticker batch after five attempts."
            exit 1
          fi
      - name: Upload worker summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: financial-report-worker-summary
          path: reports/worker-last-run.json
          if-no-files-found: ignore
          retention-days: 30
