<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kho báo cáo tài chính | Dữ Liệu Kinh Tế</title>
<meta name="description" content="Kho báo cáo tài chính doanh nghiệp, tài liệu công bố và báo cáo phân tích theo mã cổ phiếu.">
<style>
:root{--line:#ddd;--muted:#687078;--ink:#17212b;--active:#ffdda9;--blue:#1769aa}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Arial,sans-serif;color:var(--ink);background:#fff}.top{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.top h1{font-size:21px;margin:0}.top a{color:var(--blue);text-decoration:none}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 70px)}aside{border-right:1px solid var(--line);background:#fafafa}.folders{padding:8px 0}.folder{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:12px 16px;cursor:pointer;font:inherit;display:flex;gap:10px;align-items:center}.folder:hover,.folder.active{background:var(--active)}.folder .dot{width:14px;height:14px;border:1px solid #777;border-radius:50%;flex:none}.folder.active .dot{border:4px solid #1478d4;background:#fff}.content{padding:22px 20px;min-width:0}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.filters input,.filters select{border:1px solid #cfd4d9;border-radius:5px;padding:10px 12px;font:inherit;background:#fff}.filters input{flex:1;min-width:210px}.filters select{min-width:135px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.heading h2{font-size:18px;margin:0}.count{color:var(--muted);font-size:13px}.table{border-top:1px solid var(--line)}.report{display:grid;grid-template-columns:28px minmax(0,1fr) 115px;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px dotted #d3d3d3}.report:hover{background:#fff3df}.pdf{color:#686868;font-size:11px;font-weight:bold;text-align:center;border:1px solid #999;border-radius:3px;padding:4px 2px}.title{font-size:14px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px;margin-top:4px}.date{text-align:right;font-size:12px;white-space:nowrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px}.actions a{color:var(--blue);text-decoration:none;font-size:12px}.empty{padding:35px 10px;text-align:center;color:var(--muted)}.note{font-size:12px;color:var(--muted);margin-top:18px}.crumb{color:var(--muted);font-size:12px;margin-bottom:14px}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.folders{display:flex;overflow:auto;padding:6px}.folder{min-width:max-content;border:1px solid var(--line);margin:3px;border-radius:6px;padding:9px 11px}.content{padding:16px 12px}.report{grid-template-columns:28px minmax(0,1fr)}.date{grid-column:2;text-align:left}.top{padding:14px}.top h1{font-size:18px}}
</style></head>
<body>
<header class="top"><h1>📁 KHO BÁO CÁO TÀI CHÍNH</h1><a href="index.html">← Về trang chủ</a></header>
<div class="layout"><aside><nav class="folders" id="folders" aria-label="Danh mục báo cáo"></nav></aside>
<main class="content"><div class="crumb">Kho báo cáo / <span id="crumb">Tất cả</span></div>
<div class="filters"><input id="search" type="search" placeholder="Tìm tên báo cáo, mã cổ phiếu, đơn vị phát hành…"><select id="symbol"><option value="">Tất cả mã cổ phiếu</option></select><select id="year"><option value="">Tất cả năm</option></select></div>
<div class="heading"><h2 id="heading">Tất cả báo cáo</h2><span class="count" id="count"></span></div><div class="table" id="list" aria-live="polite"></div>
<p class="note">Báo cáo được lưu trên hosting chỉ khi có quyền lưu trữ phù hợp. Những báo cáo khác mở từ đường dẫn nguồn công bố. Ngày công bố và nội dung cần được đối chiếu với nguồn gốc.</p>
</main></div>
<script>
(async function(){
 const list=document.getElementById('list'),folders=document.getElementById('folders'),search=document.getElementById('search'),symbol=document.getElementById('symbol'),year=document.getElementById('year');
 let data={categories:[],reports:[]},active='';
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const date=s=>{if(!s)return 'Chưa rõ ngày';const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('vi-VN')};
 try{const r=await fetch('reports/library.json',{cache:'no-store'});if(!r.ok)throw Error();data=await r.json()}catch(e){list.innerHTML='<div class="empty">Chưa tải được danh mục báo cáo. Vui lòng thử tải lại trang.</div>';return}
 const cats=data.categories||[], reports=data.reports||[];
 function renderFolders(){folders.innerHTML='<button class="folder '+(!active?'active':'')+'" data-id=""><span class="dot"></span><span>Tất cả</span></button>'+cats.map(c=>'<button class="folder '+(active===c.id?'active':'')+'" data-id="'+esc(c.id)+'"><span class="dot"></span><span>'+esc(c.name)+'</span></button>').join('');folders.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.id;renderFolders();render()}))}
 [...new Set(reports.map(r=>r.symbol).filter(Boolean))].sort().forEach(s=>symbol.insertAdjacentHTML('beforeend','<option value="'+esc(s)+'">'+esc(s)+'</option>'));
 [...new Set(reports.map(r=>(r.report_date||'').slice(0,4)).filter(Boolean))].sort().reverse().forEach(y=>year.insertAdjacentHTML('beforeend','<option value="'+esc(y)+'">'+esc(y)+'</option>'));
 function render(){const q=search.value.trim().toLocaleLowerCase('vi'),sym=symbol.value,yr=year.value;const rows=reports.filter(r=>(!active||r.category===active)&&(!sym||r.symbol===sym)&&(!yr||(r.report_date||'').startsWith(yr))&&(!q||[r.title,r.symbol,r.publisher,r.summary,r.report_date].join(' ').toLocaleLowerCase('vi').includes(q))).sort((a,b)=>(b.report_date||'').localeCompare(a.report_date||''));
 const cat=cats.find(c=>c.id===active);document.getElementById('crumb').textContent=cat?cat.name:'Tất cả';document.getElementById('heading').textContent=cat?cat.name:'Tất cả báo cáo';document.getElementById('count').textContent=rows.length+' báo cáo';
 if(!rows.length){list.innerHTML='<div class="empty">Chưa có báo cáo phù hợp. Bạn có thể thêm thông tin vào tệp reports/library.json.</div>';return}
 list.innerHTML=rows.map(r=>{const local=r.storage_path?'<a href="'+esc(r.storage_path)+'" target="_blank" rel="noopener">Mở PDF đã lưu</a>':'';const source=r.source_url?'<a href="'+esc(r.source_url)+'" target="_blank" rel="noopener noreferrer">Mở nguồn công bố ↗</a>':'';return '<article class="report"><div class="pdf">PDF</div><div><div class="title">'+esc(r.title)+'</div><div class="meta">'+esc(r.symbol||'')+(r.publisher?' · '+esc(r.publisher):'')+(r.summary?' · '+esc(r.summary):'')+'</div><div class="actions">'+local+source+'</div></div><div class="date">'+esc(date(r.report_date))+'</div></article>'}).join('')}
 [search,symbol,year].forEach(el=>el.addEventListener('input',render));renderFolders();render();
})();
</script></body></html>
